/* ═══════════════════════════════════════════════════════════
   DESTRUCTURE REACT
═══════════════════════════════════════════════════════════ */
const {
  useState, useEffect, useRef, useCallback,
  useMemo, useLayoutEffect, createContext, useContext,
} = React;

/* ═══════════════════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════════════════ */
const HIDE_MS    = 5000;
const VOL_HUD_MS = 2000;
const DIGIT_TIMEOUT = 2000; // ms to wait before jumping to channel
const DB_NAME    = 'TeluguIPTV';
const DB_VER     = 2;

/* ═══════════════════════════════════════════════════════════
   INDEXEDDB HELPER
═══════════════════════════════════════════════════════════ */
let _db = null;
async function openDB() {
  if (_db) return _db;
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('playlists'))
        db.createObjectStore('playlists', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('meta'))
        db.createObjectStore('meta', { keyPath: 'key' });
    };
    req.onsuccess  = e => { _db = e.target.result; res(_db); };
    req.onerror    = e => rej(e.target.error);
  });
}

async function idbGet(store, key) {
  try {
    const db  = await openDB();
    return new Promise((res, rej) => {
      const tx  = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).get(key);
      req.onsuccess = e => res(e.target.result ?? null);
      req.onerror   = e => rej(e.target.error);
    });
  } catch { return null; }
}

async function idbPut(store, value) {
  try {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx  = db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).put(value);
      req.onsuccess = () => res(true);
      req.onerror   = e => rej(e.target.error);
    });
  } catch { return false; }
}

/* ═══════════════════════════════════════════════════════════
   LOCALSTORAGE HELPER (settings only — small data)
═══════════════════════════════════════════════════════════ */
const storage = {
  get(key, fallback = null) {
    try { const r = localStorage.getItem(key); return r===null?fallback:JSON.parse(r); } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
  },
  remove(key) {
    try { localStorage.removeItem(key); return true; } catch { return false; }
  },
};

/* ═══════════════════════════════════════════════════════════
   PLAYLIST SOURCES
═══════════════════════════════════════════════════════════ */
const BUILT_IN_SOURCES = [
  { id:'tel',           label:'Telugu Only',      desc:'Telugu language channels (~200)',   url:'https://iptv-org.github.io/iptv/languages/tel.m3u',          builtIn:true },
  { id:'india',         label:'India — All',       desc:'All Indian channels (~800)',        url:'https://iptv-org.github.io/iptv/countries/in.m3u',           builtIn:true },
  { id:'sports',        label:'Sports',            desc:'Sports channels worldwide',         url:'https://iptv-org.github.io/iptv/categories/sports.m3u',      builtIn:true },
  { id:'news',          label:'News',              desc:'News channels worldwide',           url:'https://iptv-org.github.io/iptv/categories/news.m3u',        builtIn:true },
  { id:'entertainment', label:'Entertainment',     desc:'Entertainment channels worldwide',  url:'https://iptv-org.github.io/iptv/categories/entertainment.m3u',builtIn:true },
];
const DEFAULT_SOURCE_ID = 'tel';
const CFG_KEY     = 'tiptv_cfg_v4';
const CUSTOM_SRCS_KEY = 'tiptv_custom_sources';
const OVERRIDES_KEY   = 'tiptv_overrides';
const FAVORITES_KEY   = 'tiptv_favorites';
const LAST_CH_KEY     = 'tiptv_last_channel';

function getAllSources() {
  const custom = storage.get(CUSTOM_SRCS_KEY, []);
  return [...BUILT_IN_SOURCES, ...custom];
}

function getSourceById(id) {
  return getAllSources().find(s => s.id === id) ?? BUILT_IN_SOURCES[0];
}

/* ═══════════════════════════════════════════════════════════
   M3U PARSER (sync fallback, also used by worker result)
═══════════════════════════════════════════════════════════ */
function parseExtInf(line) {
  const safe = re => { try { return line.match(re)?.[1]?.trim()??''; } catch { return ''; } };
  const lc = line.lastIndexOf(',');
  const dn = lc>=0 ? line.slice(lc+1).trim() : '';
  return {
    id:'', name:(safe(/tvg-name="([^"]*)"/)|| dn ||'Unknown').trim(),
    logo:safe(/tvg-logo="([^"]*)"/), group:(safe(/group-title="([^"]*)"/)|| 'General').trim(),
    language:safe(/tvg-language="([^"]*)"/), country:safe(/tvg-country="([^"]*)"/), url:'',
  };
}
function parseM3USync(text) {
  const channels=[]; let cur=null;
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF:'))       { cur = parseExtInf(line); }
    else if (line.startsWith('#'))         { continue; }
    else if (cur && (line.startsWith('http')||line.startsWith('rtmp'))) {
      cur.url=line; cur.id=`ch_${channels.length}`; channels.push(cur); cur=null;
    }
  }
  return channels;
}

/* ═══════════════════════════════════════════════════════════
   CATEGORY HELPERS
═══════════════════════════════════════════════════════════ */
function getCategoryIcon(g='') {
  const l=g.toLowerCase();
  if(l.includes('news'))                            return '📰';
  if(l.includes('movie')||l.includes('film'))       return '🎬';
  if(l.includes('music')||l.includes('song'))       return '🎵';
  if(l.includes('sport')||l.includes('cricket'))    return '🏏';
  if(l.includes('kids')||l.includes('cartoon'))     return '🧒';
  if(l.includes('entertain')||l.includes('serial')) return '🎭';
  if(l.includes('devot')||l.includes('spirit'))     return '🙏';
  if(l.includes('comedy'))                          return '😂';
  if(l.includes('telugu'))                          return '🌟';
  if(l.includes('tamil'))                           return '🎪';
  if(l.includes('hindi'))                           return '🇮🇳';
  if(l.includes('english'))                         return '🌐';
  return '📡';
}
function extractCategories(channels) {
  if (!Array.isArray(channels)) return [{ name:'All', count:0, icon:'📺' }];
  const map = new Map();
  for (const ch of channels) {
    const g = ch?.group||'General';
    const e = map.get(g);
    if (e) e.count++; else map.set(g,{name:g,count:1,icon:getCategoryIcon(g)});
  }
  const cats = Array.from(map.values()).sort((a,b)=>b.count-a.count);
  return [{name:'All',count:channels.length,icon:'📺'}, ...cats];
}
function filterByCategory(chs, cat) {
  if (!cat||cat==='All'||cat==='⭐ Favorites') return chs;
  return chs.filter(ch=>ch?.group===cat);
}
function searchChannels(chs, q) {
  if (!q) return chs;
  const lq=q.toLowerCase();
  return chs.filter(ch=>ch?.name?.toLowerCase().includes(lq));
}

/* ═══════════════════════════════════════════════════════════
   FETCH WITH PROXIES
═══════════════════════════════════════════════════════════ */
const PROXIES=[u=>u, u=>`https://corsproxy.io/?${encodeURIComponent(u)}`, u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`];
async function fetchPlaylist(url) {
  for (const proxy of PROXIES) {
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 18000);
    try {
      const r = await fetch(proxy(url),{signal:ctrl.signal,headers:{Accept:'application/x-mpegurl,*/*'}});
      clearTimeout(t);
      if (r.ok) { const txt=await r.text(); if(txt.includes('#EXTINF')||txt.includes('#EXTM3U')) return txt; }
    } catch { clearTimeout(t); }
  }
  return null;
}

/* ═══════════════════════════════════════════════════════════
   TTL MAP
═══════════════════════════════════════════════════════════ */
const TTL_MAP=[3600000, 6*3600000, 12*3600000, 24*3600000];

/* ═══════════════════════════════════════════════════════════
   PLAYER STATE
═══════════════════════════════════════════════════════════ */
const PS={NONE:'NONE',IDLE:'IDLE',LOADING:'LOADING',PLAYING:'PLAYING',PAUSED:'PAUSED',ERROR:'ERROR'};

/* ═══════════════════════════════════════════════════════════
   REMOTE KEY CODES
═══════════════════════════════════════════════════════════ */
const KEYS={
  UP:38,DOWN:40,LEFT:37,RIGHT:39,ENTER:13,
  BACK:10009,EXIT:10182,
  PLAY:415,PAUSE:19,PLAY_PAUSE:10252,STOP:413,
  FAST_FORWARD:417,REWIND:412,
  NUM_0:48,NUM_9:57,
  RED:403,GREEN:404,YELLOW:405,BLUE:406,
  CHANNEL_UP:427,CHANNEL_DOWN:428,
  VOLUME_UP:447,VOLUME_DOWN:448,MUTE:449,
  INFO:457,TOOLS:10135,GUIDE:458,
};
const TIZEN_KEY_NAMES=[
  'MediaPlayPause','MediaPlay','MediaPause','MediaStop','MediaFastForward','MediaRewind',
  'ChannelUp','ChannelDown','VolumeUp','VolumeDown','VolumeMute',
  'ColorF0Red','ColorF1Green','ColorF2Yellow','ColorF3Blue',
  'Exit','Tools','Guide','Info','Return',
];
function registerTizenKeys() {
  try { if(window.tizen?.tvinputdevice) TIZEN_KEY_NAMES.forEach(k=>{try{window.tizen.tvinputdevice.registerKey(k);}catch{}}); } catch {}
}

/* ═══════════════════════════════════════════════════════════
   HOOK: useRemoteControl
═══════════════════════════════════════════════════════════ */
function useRemoteControl(handlers, enabled=true) {
  const hRef = useRef(handlers);
  const enRef = useRef(enabled);
  hRef.current = handlers;
  enRef.current = enabled;

  useEffect(()=>{ registerTizenKeys(); }, []);

  const onKey = useCallback((e) => {
    if (!enRef.current) return;
    const h=hRef.current, kc=e.keyCode;
    h.onAnyKey?.();
    switch(kc) {
      case KEYS.UP:           e.preventDefault(); h.onUp?.();          break;
      case KEYS.DOWN:         e.preventDefault(); h.onDown?.();        break;
      case KEYS.LEFT:         e.preventDefault(); h.onLeft?.();        break;
      case KEYS.RIGHT:        e.preventDefault(); h.onRight?.();       break;
      case KEYS.ENTER:        e.preventDefault(); h.onEnter?.();       break;
      case KEYS.BACK:         e.preventDefault(); h.onBack?.();        break;
      case KEYS.EXIT:         e.preventDefault(); h.onExit?.();        break;
      case KEYS.PLAY:
      case KEYS.PLAY_PAUSE:   e.preventDefault(); h.onPlayPause?.();   break;
      case KEYS.PAUSE:        e.preventDefault(); h.onPlayPause?.();   break;
      case KEYS.STOP:         e.preventDefault(); h.onStop?.();        break;
      case KEYS.FAST_FORWARD: e.preventDefault(); h.onForward?.();     break;
      case KEYS.REWIND:       e.preventDefault(); h.onRewind?.();      break;
      case KEYS.CHANNEL_UP:   e.preventDefault(); h.onChannelUp?.();   break;
      case KEYS.CHANNEL_DOWN: e.preventDefault(); h.onChannelDown?.(); break;
      case KEYS.VOLUME_UP:    e.preventDefault(); h.onVolumeUp?.();    break;
      case KEYS.VOLUME_DOWN:  e.preventDefault(); h.onVolumeDown?.();  break;
      case KEYS.MUTE:         e.preventDefault(); h.onMute?.();        break;
      case KEYS.RED:          e.preventDefault(); h.onRed?.();         break;
      case KEYS.GREEN:        e.preventDefault(); h.onGreen?.();       break;
      case KEYS.YELLOW:       e.preventDefault(); h.onYellow?.();      break;
      case KEYS.BLUE:         e.preventDefault(); h.onBlue?.();        break;
      case KEYS.INFO:         e.preventDefault(); h.onInfo?.();        break;
      case KEYS.TOOLS:        e.preventDefault(); h.onSettings?.();    break;
      case KEYS.GUIDE:        e.preventDefault(); h.onGuide?.();       break;
      default:
        if (kc>=KEYS.NUM_0 && kc<=KEYS.NUM_9) { e.preventDefault(); h.onDigit?.(kc-KEYS.NUM_0); }
    }
  }, []);

  useEffect(()=>{
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  }, [onKey]);
}

/* ═══════════════════════════════════════════════════════════
   HOOK: useAVPlay
═══════════════════════════════════════════════════════════ */
function useAVPlay() {
  const [playerState, setPlayerState] = useState(PS.NONE);
  const [isBuffering, setIsBuffering] = useState(false);
  const [isMuted,     setIsMuted]     = useState(false);
  const avRef     = useRef(null);
  const isTizen   = typeof window!=='undefined' && !!window.webapis?.avplay;

  useEffect(()=>{
    if (isTizen) avRef.current = window.webapis.avplay;
    setPlayerState(PS.IDLE);
    return ()=>_destroy();
  }, []); // eslint-disable-line

  function _destroy() {
    if (isTizen && avRef.current) {
      try { const s=avRef.current.getState(); if(s!=='NONE'&&s!=='IDLE'){avRef.current.stop();avRef.current.close();} } catch {}
    } else { const v=document.getElementById('avplay-video'); if(v){v.pause();v.src='';} }
  }

  // Apply AVPlay buffer setting from config
  function applyBufferSetting(bufIdx) {
    if (!isTizen || !avRef.current) return;
    const MS_MAP = [2000, 5000, 10000];
    const ms = MS_MAP[bufIdx ?? 1] ?? 5000;
    try { avRef.current.setBufferingParam?.({buffering_time: ms}); } catch {}
  }

  const playChannel = useCallback(async (url, name) => {
    if (!url) return;
    setIsBuffering(true);
    setPlayerState(PS.LOADING);
    // Read buffer setting
    const cfg   = storage.get(CFG_KEY, {});
    const bufIdx = cfg.bufferSize ?? 1;

    if (isTizen) {
      try {
        const ap=avRef.current;
        const st=ap.getState();
        if(st!=='NONE'&&st!=='IDLE'){ap.stop();ap.close();}
        ap.open(url);
        applyBufferSetting(bufIdx);
        ap.setDisplayRect(0,0,1920,1080);
        ap.setDisplayMethod('PLAYER_DISPLAY_MODE_FULL_SCREEN');
        ap.setListener({
          onbufferingstart:    ()  =>setIsBuffering(true),
          onbufferingprogress: ()  =>{},
          onbufferingcomplete: ()  =>setIsBuffering(false),
          oncurrentplaytime:   ()  =>{},
          onEvent:             ()  =>{},
          onerror: (err)=>{
            console.error('AVPlay',err);
            setPlayerState(PS.ERROR);
            setIsBuffering(false);
          },
          ondrmevent:        ()=>{},
          onstreamcompleted: ()=>setPlayerState(PS.IDLE),
        });
        ap.prepare();
        ap.play();
        setPlayerState(PS.PLAYING);
        setIsBuffering(false);
      } catch(ex) {
        console.error('AVPlay exception',ex);
        setPlayerState(PS.ERROR);
        setIsBuffering(false);
      }
    } else {
      const v=document.getElementById('avplay-video');
      if (!v) return;
      v.src=url; v.load();
      v.oncanplay = ()=>{setIsBuffering(false);setPlayerState(PS.PLAYING);};
      v.onwaiting = ()=>setIsBuffering(true);
      v.onplaying = ()=>{setIsBuffering(false);setPlayerState(PS.PLAYING);};
      v.onerror   = ()=>{setPlayerState(PS.ERROR);setIsBuffering(false);};
      v.muted=isMuted;
      try { await v.play(); } catch { setPlayerState(PS.ERROR); setIsBuffering(false); }
    }
  }, [isTizen, isMuted]);

  const togglePause = useCallback(()=>{
    if (isTizen&&avRef.current) {
      const s=avRef.current.getState();
      if(s==='PLAYING'){avRef.current.pause();setPlayerState(PS.PAUSED);}
      else if(s==='PAUSED'){avRef.current.play();setPlayerState(PS.PLAYING);}
    } else {
      const v=document.getElementById('avplay-video');
      if (!v) return;
      if(v.paused){v.play();setPlayerState(PS.PLAYING);}else{v.pause();setPlayerState(PS.PAUSED);}
    }
  }, [isTizen]);

  const stop = useCallback(()=>{ _destroy(); setPlayerState(PS.IDLE); setIsBuffering(false); }, [isTizen]);

  const toggleMute = useCallback(()=>{
    setIsMuted(m=>{
      const next=!m;
      if(isTizen&&avRef.current){try{avRef.current.setMute(next);}catch{}}
      else{const v=document.getElementById('avplay-video');if(v)v.muted=next;}
      return next;
    });
  }, [isTizen]);

  return { playerState, isBuffering, isMuted, isTizen, playChannel, togglePause, stop, toggleMute };
}

/* ═══════════════════════════════════════════════════════════
   HOOK: useVolume
═══════════════════════════════════════════════════════════ */
function useVolume() {
  const isTizen = typeof window!=='undefined' && !!window.webapis?.tvaudiocontrol;
  const getSysVol = ()=>{ try{return isTizen?window.webapis.tvaudiocontrol.getVolume():50;}catch{return 50;} };
  const getSysMute= ()=>{ try{return isTizen?window.webapis.tvaudiocontrol.isMute():false;}catch{return false;} };
  const [volume, setVol] = useState(getSysVol);
  const [isMuted, setMuted] = useState(getSysMute);
  const vRef = useRef(volume);

  const applyVol = useCallback((v)=>{
    const c=Math.min(100,Math.max(0,v)); vRef.current=c; setVol(c);
    if(isTizen){try{window.webapis.tvaudiocontrol.setVolume(c);}catch{}}
    else{const vid=document.getElementById('avplay-video');if(vid)vid.volume=c/100;}
  }, [isTizen]);

  const volumeUp   = useCallback(()=>applyVol(vRef.current+5),[applyVol]);
  const volumeDown = useCallback(()=>applyVol(vRef.current-5),[applyVol]);
  const toggleMute = useCallback(()=>{
    setMuted(m=>{const next=!m;
      if(isTizen){try{window.webapis.tvaudiocontrol.setMute(next);}catch{}}
      else{const v=document.getElementById('avplay-video');if(v)v.muted=next;}
      return next;
    });
  },[isTizen]);

  return {volume, isMuted, volumeUp, volumeDown, toggleMute};
}

/* ═══════════════════════════════════════════════════════════
   HOOK: usePlaylist (with Web Worker + IndexedDB)
═══════════════════════════════════════════════════════════ */
function usePlaylist() {
  const [activeSourceId, setActiveSourceIdState] = useState(()=>{
    const cfg=storage.get(CFG_KEY,{}); return cfg.playlistSource??DEFAULT_SOURCE_ID;
  });
  const activeIdRef = useRef(activeSourceId);

  const [allChannels,  setAllChannels]  = useState([]);
  const [loading,      setLoading]      = useState(true);
  const [loadProgress, setLoadProgress] = useState(0);
  const [loadStatus,   setLoadStatus]   = useState('Loading…');
  const [error,        setError]        = useState(null);

  const [selectedCategory, setSelectedCategory] = useState('All');
  const [searchQuery,      setSearchQuery]      = useState('');
  const [currentChannelIndex, setCurrentChannelIndex] = useState(-1);

  const workerRef = useRef(null);

  const setActiveSourceId = useCallback((id)=>{
    activeIdRef.current=id;
    setActiveSourceIdState(id);
    const cfg=storage.get(CFG_KEY,{});
    storage.set(CFG_KEY,{...cfg,playlistSource:id});
    setSelectedCategory('All');
    setCurrentChannelIndex(-1);
    setSearchQuery('');
  },[]);

  const loadPlaylist = useCallback(async(forceRefresh=false)=>{
    const sourceId = activeIdRef.current;
    const source   = getSourceById(sourceId);
    setLoading(true); setError(null); setLoadProgress(0); setLoadStatus('Checking cache…');

    const cfg    = storage.get(CFG_KEY,{});
    const cacheOn= cfg.cacheOn!==false;
    const ttlMs  = TTL_MAP[cfg.cacheTTL??1]??TTL_MAP[1];

    // Check IndexedDB cache
    if (!forceRefresh && cacheOn) {
      const cached = await idbGet('playlists', sourceId);
      if (cached && Array.isArray(cached.channels) && cached.channels.length>0) {
        const age = Date.now() - (cached.timestamp||0);
        if (age < ttlMs) {
          setAllChannels(cached.channels);
          setLoadProgress(100);
          setLoadStatus(`${cached.channels.length} channels (cached)`);
          setLoading(false);
          return;
        }
      }
    }

    // Try Web Worker for fetch+parse
    if (typeof Worker !== 'undefined') {
      try {
        if (workerRef.current) workerRef.current.terminate();
        const worker = new Worker('./m3u-worker.js');
        workerRef.current = worker;
        setLoadStatus(`Fetching ${source.label}…`);
        setLoadProgress(5);

        await new Promise((resolve, reject)=>{
          worker.onmessage = async({data})=>{
            if (data.type==='PROGRESS') {
              setLoadProgress(data.pct);
              setLoadStatus(data.status);
            } else if (data.type==='RESULT') {
              const channels = data.channels;
              if (channels.length===0) { reject(new Error('No channels found')); return; }
              if (cacheOn) {
                await idbPut('playlists',{id:sourceId,channels,timestamp:Date.now(),ttlMs});
              }
              setAllChannels(channels);
              setLoadProgress(100);
              setLoadStatus(`${channels.length} channels ready`);
              setLoading(false);
              resolve();
            } else if (data.type==='ERROR') {
              reject(new Error(data.message));
            }
          };
          worker.onerror = e => reject(e);
          worker.postMessage({type:'FETCH_AND_PARSE', id:sourceId, url:source.url});
        });
        return;
      } catch(workerErr) {
        console.warn('[Playlist] Worker failed, falling back:', workerErr);
      }
    }

    // Fallback: main-thread fetch+parse
    setLoadStatus(`Fetching ${source.label}…`); setLoadProgress(15);
    const content = await fetchPlaylist(source.url);
    if (!content) { setError(`Could not load "${source.label}".`); setLoading(false); return; }
    setLoadProgress(65); setLoadStatus('Parsing…');
    const channels = parseM3USync(content);
    if (channels.length===0) { setError(`No channels in "${source.label}".`); setLoading(false); return; }
    if (cacheOn) await idbPut('playlists',{id:sourceId,channels,timestamp:Date.now(),ttlMs});
    setAllChannels(channels); setLoadProgress(100); setLoadStatus(`${channels.length} channels ready`); setLoading(false);
  }, []);

  useEffect(()=>{ loadPlaylist(false); }, [activeSourceId, loadPlaylist]);

  // Cleanup worker on unmount
  useEffect(()=>()=>{ workerRef.current?.terminate(); }, []);

  const refreshPlaylist = useCallback(()=>loadPlaylist(true), [loadPlaylist]);

  const categories = useMemo(()=>extractCategories(allChannels), [allChannels]);

  // Favorites
  const [favorites, setFavorites] = useState(()=>storage.get(FAVORITES_KEY,[]));
  const toggleFavorite = useCallback((chId)=>{
    setFavorites(prev=>{
      const next = prev.includes(chId) ? prev.filter(x=>x!==chId) : [...prev,chId];
      storage.set(FAVORITES_KEY,next);
      return next;
    });
  },[]);

  // Channel overrides (custom name/logo)
  const [overrides, setOverrides] = useState(()=>storage.get(OVERRIDES_KEY,{}));
  const saveOverride = useCallback((chId, data)=>{
    setOverrides(prev=>{ const n={...prev,[chId]:data}; storage.set(OVERRIDES_KEY,n); return n; });
  },[]);

  // Compute categories including ⭐ Favorites
  const categoriesWithFavs = useMemo(()=>{
    const favChannels = allChannels.filter(ch=>favorites.includes(ch.id));
    if (favChannels.length===0) return categories;
    return [{name:'⭐ Favorites',count:favChannels.length,icon:'⭐'}, ...categories];
  },[categories, allChannels, favorites]);

  const filteredChannels = useMemo(()=>{
    let chs;
    if (selectedCategory==='⭐ Favorites') {
      chs = allChannels.filter(ch=>favorites.includes(ch.id));
    } else {
      chs = filterByCategory(allChannels, selectedCategory);
    }
    if (searchQuery) chs = searchChannels(chs, searchQuery);
    // Apply overrides
    return chs.map(ch=>{
      const ov = overrides[ch.id];
      if (!ov) return ch;
      return {...ch, name:ov.name||ch.name, logo:ov.logo||ch.logo};
    });
  },[allChannels, selectedCategory, searchQuery, overrides, favorites]);

  const currentChannel = useMemo(()=>{
    if (currentChannelIndex<0||currentChannelIndex>=filteredChannels.length) return null;
    return filteredChannels[currentChannelIndex]??null;
  },[filteredChannels,currentChannelIndex]);

  const selectChannel = useCallback((index)=>setCurrentChannelIndex(index),[]);

  return {
    allChannels, filteredChannels, categories:categoriesWithFavs,
    loading, loadProgress, loadStatus, error,
    selectedCategory, setSelectedCategory,
    searchQuery, setSearchQuery,
    currentChannel, currentChannelIndex, selectChannel,
    refreshPlaylist,
    activeSourceId, setActiveSourceId,
    favorites, toggleFavorite,
    overrides, saveOverride,
  };
}

/* ═══════════════════════════════════════════════════════════
   CHANNEL LOGO COMPONENT
═══════════════════════════════════════════════════════════ */
const GRADS=[['#1a1a1a','#2e2e2e'],['#111','#252525'],['#0d0d0d','#222'],['#181818','#2c2c2c'],['#0f0f0f','#1e1e1e'],['#141414','#282828'],['#1c1c1c','#303030'],['#0a0a0a','#1a1a1a'],['#161616','#2a2a2a'],['#121212','#242424']];
function colorFor(name=''){let h=5381;for(let i=0;i<name.length;i++)h=((h*33)^name.charCodeAt(i))>>>0;return GRADS[h%GRADS.length];}
function initials(name=''){const c=name.trim();if(!c)return'CH';const w=c.split(/[\s\-_|]+/).filter(Boolean);if(w.length===1)return w[0].slice(0,2).toUpperCase();return(w[0][0]+w[1][0]).toUpperCase();}

function ChannelLogo({src,name='',size=56,radius=12,className='',lazy=false}) {
  const [err,setErr]=useState(false);
  const [bg,fg]=colorFor(name);
  const imgRef=useRef(null);
  // Intersection Observer for lazy loading
  const [visible,setVisible]=useState(!lazy);
  useEffect(()=>{
    if (!lazy||!imgRef.current) return;
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){setVisible(true);obs.disconnect();}},{rootMargin:'200px'});
    obs.observe(imgRef.current);
    return()=>obs.disconnect();
  },[lazy]);
  const base={width:size,height:size,borderRadius:radius,flexShrink:0,overflow:'hidden'};
  if (!src||err||!visible) {
    return (<div ref={imgRef} style={{...base,background:`linear-gradient(145deg,${bg},${fg})`,border:'1px solid rgba(255,255,255,.06)',display:'flex',alignItems:'center',justifyContent:'center'}} className={className}>
      <span style={{color:'rgba(255,255,255,.55)',fontWeight:700,fontSize:Math.round(size*.31),letterSpacing:'-.02em',fontFamily:'inherit',lineHeight:1,userSelect:'none'}}>{initials(name)}</span>
    </div>);
  }
  return (<img ref={imgRef} src={src} alt={name} style={{...base,objectFit:'contain',background:'#111'}} className={className} onError={()=>setErr(true)} loading="lazy"/>);
}

/* ═══════════════════════════════════════════════════════════
   CHANNEL STRIP
═══════════════════════════════════════════════════════════ */
function ChannelStrip({channels,currentIndex,focusedIndex,onSelect,favorites,onToggleFav,onEditRequest}) {
  const trackRef=useRef(null);
  useLayoutEffect(()=>{
    if (!trackRef.current) return;
    const tx=RING_L-focusedIndex*STEP;
    trackRef.current.style.transform=`translateX(${tx}px)`;
  });
  if (!channels.length) return null;
  const STRIP_H=CARD_H+36+16;
  return (
    <div style={{position:'relative',height:STRIP_H,flexShrink:0,overflow:'hidden',
      background:'linear-gradient(to top,rgba(0,0,0,.96) 0%,rgba(0,0,0,.7) 55%,transparent 100%)'}}>
      <div style={{position:'absolute',inset:0,zIndex:10,pointerEvents:'none',
        background:'linear-gradient(to right,rgba(0,0,0,.9) 0%,transparent 200px,transparent calc(100% - 200px),rgba(0,0,0,.9) 100%)'}}/>
      <div style={{position:'absolute',left:RING_L-RING_PAD,top:36-RING_PAD,width:CARD_W+RING_PAD*2,height:CARD_H+RING_PAD*2,borderRadius:22,border:'2.5px solid rgba(255,255,255,.88)',boxShadow:'0 0 0 1px rgba(255,255,255,.07),0 0 32px rgba(255,255,255,.10)',zIndex:20,pointerEvents:'none'}}/>

        {channels.map((ch,idx)=>(
          <ChannelCard key={ch.id||`c${idx}`} channel={ch} index={idx}

            onEditRequest={onEditRequest}
          />
        ))}
      </div>
    </div>
  );
}

          {query?`${resultCount} channel${resultCount!==1?'s':''} found`:'Type to search · BACK or 🟩 to close'}
        </p>
      </div>
    </>
  );
}

/* ═══════════════════════════════════════════════════════════
   SETTINGS PANEL
═══════════════════════════════════════════════════════════ */
const BUFFER_SIZE_LABELS = ['Small (2s)','Medium (5s)','Large (10s)'];
const SETTINGS_TABS = ['Playback','Display','Playlist','Custom M3U','About'];
export const SETTINGS_TAB_COUNT = SETTINGS_TABS.length;
export function SETTINGS_ITEM_COUNT(tabIdx) {
  if (tabIdx===0) return 4; // Playback
  if (tabIdx===1) return 3; // Display
  if (tabIdx===2) return getAllSources().length + 3; // sources + cache items
  if (tabIdx===3) return 4; // custom M3U form rows + actions
  if (tabIdx===4) return 4; // About
  return 0;
}

function SettingsPanel({isOpen,onClose,onRefreshPlaylist,focusedTab,focusedItem,onTabChange,onItemAction,activeSourceId,onSourceChange}) {
  const [cfg,setCfg]=useState(()=>storage.get(CFG_KEY,{bufferSize:1,cacheOn:true,cacheTTL:1,autoplay:true,muteOnStart:false,aspectRatio:0,showBug:true,hintBar:true}));
  const [customSrcs,setCustomSrcs]=useState(()=>storage.get(CUSTOM_SRCS_KEY,[]));
  const [newName,setNewName]=useState('');
  const [newUrl,setNewUrl]=useState('');

  const saveCfg = next=>{setCfg(next);storage.set(CFG_KEY,next);};
  const set = (k,v)=>saveCfg({...cfg,[k]:v});

  const allSrc = getAllSources();

  useEffect(()=>{
    if (!onItemAction) return;
    onItemAction.current = (tabIdx,itemIdx)=>{
      if (tabIdx===0) { // Playback
        const keys=['autoplay','muteOnStart','bufferSize','quality'];
        const item=keys[itemIdx];
        if (item==='autoplay'||item==='muteOnStart') set(item,!cfg[item]);
        if (item==='bufferSize') set('bufferSize',((cfg.bufferSize??1)+1)%3);
        if (item==='quality') set('quality',((cfg.quality??0)+1)%4);
      } else if (tabIdx===1) { // Display
        const keys=['aspectRatio','showBug','hintBar'];
        const item=keys[itemIdx];
        if (item==='aspectRatio') set('aspectRatio',((cfg.aspectRatio??0)+1)%4);
        else set(item,!cfg[item]);
      } else if (tabIdx===2) { // Playlist
        if (itemIdx<allSrc.length) {
          const src=allSrc[itemIdx];
          if (src&&src.id!==activeSourceId) onSourceChange?.(src.id);
          return;
        }
        const si=itemIdx-allSrc.length;
        if (si===0) set('cacheOn',!cfg.cacheOn);
        if (si===1) set('cacheTTL',((cfg.cacheTTL??1)+1)%4);
        if (si===2) { onRefreshPlaylist?.(); onClose?.(); }
      } else if (tabIdx===3) { // Custom M3U — handled by buttons
      } else if (tabIdx===4) { /* About — no actions */ }
    };
  }); // runs every render — cfg fresh

  const addCustomSource = ()=>{
    if (!newName.trim()||!newUrl.trim()) return;
    const id=`custom_${Date.now()}`;
    const src={id,label:newName.trim(),desc:'Custom M3U playlist',url:newUrl.trim(),builtIn:false};
    const next=[...customSrcs,src];
    setCustomSrcs(next);
    storage.set(CUSTOM_SRCS_KEY,next);
    setNewName(''); setNewUrl('');
  };
  const removeCustomSource = (srcId)=>{
    const next=customSrcs.filter(s=>s.id!==srcId);
    setCustomSrcs(next);
    storage.set(CUSTOM_SRCS_KEY,next);
    if (activeSourceId===srcId) onSourceChange?.(DEFAULT_SOURCE_ID);
  };

  if (!isOpen) return null;

  const tabLabel=SETTINGS_TABS[focusedTab]||'Playback';

  return (
    <>
      <div onClick={onClose} style={{position:'absolute',inset:0,zIndex:60,background:'rgba(0,0,0,.62)',backdropFilter:'blur(8px)',WebkitBackdropFilter:'blur(8px)'}}/>
      <div className="slide-right" style={{position:'absolute',top:0,right:0,bottom:0,zIndex:70,width:700,background:'#0C0C0C',borderLeft:'1px solid rgba(255,255,255,.07)',display:'flex',flexDirection:'column',boxShadow:'-60px 0 120px rgba(0,0,0,.88)'}}>
        <div style={{height:76,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 32px',borderBottom:'1px solid rgba(255,255,255,.06)'}}>
          <span style={{color:'#fff',fontWeight:800,fontSize:24,letterSpacing:'-.035em'}}>Settings</span>
          <kbd style={{color:'rgba(255,255,255,.28)',fontSize:12,fontWeight:600,background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.1)',borderRadius:7,padding:'4px 12px',fontFamily:'inherit'}}>BACK to close</kbd>
        </div>
        {/* Tabs */}
        <div style={{display:'flex',borderBottom:'1px solid rgba(255,255,255,.06)',flexShrink:0}}>
          {SETTINGS_TABS.map((t,i)=>{
            const active=i===focusedTab;
            return (<button key={t} onClick={()=>onTabChange(i)} style={{flex:1,height:54,border:'none',cursor:'pointer',background:'transparent',fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:6,color:active?'#fff':'rgba(255,255,255,.3)',fontSize:13,fontWeight:active?600:500,borderBottom:`2.5px solid ${active?'rgba(255,255,255,.8)':'transparent'}`,transition:'all .15s'}}>{t}</button>);
          })}
        </div>
        {/* Content */}
        <div style={{flex:1,overflowY:'auto',padding:'12px 24px 32px'}}>

          {/* ── PLAYBACK TAB ── */}
          {focusedTab===0&&[
            {k:'autoplay',    label:'Autoplay on select',type:'toggle',val:cfg.autoplay!==false,desc:'Begin playing when OK pressed'},
            {k:'muteOnStart', label:'Start muted',       type:'toggle',val:!!cfg.muteOnStart,   desc:'Always begin playback muted'},
            {k:'bufferSize',  label:'Buffer size',       type:'cycle', val:BUFFER_SIZE_LABELS[cfg.bufferSize??1],desc:'Larger = smoother but slower to start'},
            {k:'quality',     label:'Quality preference',type:'cycle', val:['Auto','1080p','720p','480p'][cfg.quality??0],desc:'Preferred stream quality'},
          ].map((item,idx)=>(
            <SRow key={item.k} item={item} focused={idx===focusedItem}
              onClick={()=>onItemAction.current?.(0,idx)}/>
          ))}

          {/* ── DISPLAY TAB ── */}
          {focusedTab===1&&[
            {k:'aspectRatio',label:'Aspect ratio',  type:'cycle', val:['Auto','16:9','4:3','Fill'][cfg.aspectRatio??0],desc:'How video fills the screen'},
            {k:'showBug',    label:'Channel badge',  type:'toggle',val:cfg.showBug!==false,desc:'Show channel name while watching'},
            {k:'hintBar',    label:'Key hints',      type:'toggle',val:cfg.hintBar!==false,desc:'Remote shortcut hints at bottom'},
          ].map((item,idx)=>(
            <SRow key={item.k} item={item} focused={idx===focusedItem}
              onClick={()=>onItemAction.current?.(1,idx)}/>
          ))}

          {/* ── PLAYLIST TAB ── */}
          {focusedTab===2&&(<>
            <p style={{color:'rgba(255,255,255,.28)',fontSize:12,fontWeight:600,letterSpacing:'.08em',textTransform:'uppercase',margin:'8px 4px 10px'}}>Select Playlist Source</p>
            {allSrc.map((src,idx)=>{
              const focused=idx===focusedItem, isActive=src.id===activeSourceId;
              return (<div key={src.id} onClick={()=>{if(!isActive)onSourceChange?.(src.id);}}
                style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'18px 20px',borderRadius:14,marginBottom:6,gap:28,cursor:'pointer',
                  background:focused?'rgba(255,255,255,.09)':isActive?'rgba(255,255,255,.04)':'rgba(255,255,255,.025)',
                  border:`1.5px solid ${focused?'rgba(255,255,255,.3)':isActive?'rgba(255,255,255,.18)':'rgba(255,255,255,.04)'}`,transition:'all .12s'}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <p style={{color:focused?'#fff':'rgba(255,255,255,.82)',fontSize:17,fontWeight:600,marginBottom:4}}>{src.label}</p>
                    {isActive&&<span style={{background:'rgba(255,255,255,.12)',color:'rgba(255,255,255,.6)',fontSize:10,fontWeight:700,letterSpacing:'.08em',padding:'2px 8px',borderRadius:99,textTransform:'uppercase'}}>Active</span>}
                    {!src.builtIn&&<span style={{background:'rgba(100,200,255,.1)',color:'rgba(100,200,255,.7)',fontSize:10,fontWeight:700,letterSpacing:'.06em',padding:'2px 8px',borderRadius:99,textTransform:'uppercase'}}>Custom</span>}
                  </div>
                  <p style={{color:'rgba(255,255,255,.28)',fontSize:13,lineHeight:1.5}}>{src.desc}</p>
                </div>
                <div style={{width:22,height:22,borderRadius:'50%',border:'2px solid rgba(255,255,255,.25)',background:isActive?'rgba(255,255,255,.85)':'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {isActive&&<div style={{width:8,height:8,borderRadius:'50%',background:'#000'}}/>}
                </div>
              </div>);
            })}
            <div style={{height:1,background:'rgba(255,255,255,.06)',margin:'16px 0'}}/>
            {[
              {k:'cacheOn', label:'Cache playlist', type:'toggle',val:cfg.cacheOn!==false, desc:'Store locally for faster startup'},
              {k:'cacheTTL',label:'Cache duration', type:'cycle', val:['1 hour','6 hours','12 hours','24 hours'][cfg.cacheTTL??1],desc:'How long before re-fetching'},
              {k:'__refresh',label:'Refresh now',   type:'action',actionLabel:'Refresh',desc:'Force re-download selected playlist'},
            ].map((item,si)=>{
              const idx=allSrc.length+si;
              return (<SRow key={item.k} item={item} focused={idx===focusedItem}
                onClick={()=>onItemAction.current?.(2,idx)}/>);
            })}
          </>)}

          {/* ── CUSTOM M3U TAB ── */}
          {focusedTab===3&&(<>
            <p style={{color:'rgba(255,255,255,.4)',fontSize:14,lineHeight:1.6,margin:'8px 4px 20px'}}>Add your own M3U playlist URL. It will appear in the Playlist tab for selection.</p>
            <label style={{display:'block',marginBottom:16}}>
              <span style={{color:'rgba(255,255,255,.5)',fontSize:12,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',display:'block',marginBottom:8}}>Playlist Name</span>
              <input value={newName} onChange={e=>setNewName(e.target.value)}
                style={{width:'100%',background:'rgba(255,255,255,.07)',border:`1.5px solid ${focusedItem===0?'rgba(255,255,255,.4)':'rgba(255,255,255,.12)'}`,borderRadius:12,padding:'14px 18px',color:'#fff',fontSize:16,fontFamily:'inherit',outline:'none'}}
                placeholder="My Playlist"/>
            </label>
            <label style={{display:'block',marginBottom:20}}>
              <span style={{color:'rgba(255,255,255,.5)',fontSize:12,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',display:'block',marginBottom:8}}>M3U URL</span>
              <input value={newUrl} onChange={e=>setNewUrl(e.target.value)}
                style={{width:'100%',background:'rgba(255,255,255,.07)',border:`1.5px solid ${focusedItem===1?'rgba(255,255,255,.4)':'rgba(255,255,255,.12)'}`,borderRadius:12,padding:'14px 18px',color:'#fff',fontSize:14,fontFamily:'inherit',outline:'none'}}
                placeholder="https://example.com/playlist.m3u"/>
            </label>
            <button onClick={addCustomSource}
              style={{padding:'14px 36px',borderRadius:12,background:'rgba(255,255,255,.14)',border:'1px solid rgba(255,255,255,.25)',color:'#fff',fontSize:16,fontWeight:700,cursor:'pointer',fontFamily:'inherit',marginBottom:28}}>Add Playlist</button>
            {customSrcs.length>0&&(<>
              <p style={{color:'rgba(255,255,255,.28)',fontSize:12,fontWeight:600,letterSpacing:'.08em',textTransform:'uppercase',margin:'0 4px 10px'}}>Your Custom Playlists</p>
              {customSrcs.map(src=>(
                <div key={src.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 20px',borderRadius:14,marginBottom:6,background:'rgba(255,255,255,.03)',border:'1px solid rgba(255,255,255,.06)'}}>
                  <div style={{flex:1,minWidth:0}}>
                    <p style={{color:'rgba(255,255,255,.82)',fontSize:16,fontWeight:600,marginBottom:2}}>{src.label}</p>
                    <p style={{color:'rgba(255,255,255,.25)',fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{src.url}</p>
                  </div>
                  <button onClick={()=>removeCustomSource(src.id)}
                    style={{marginLeft:16,background:'rgba(255,60,60,.1)',border:'1px solid rgba(255,60,60,.2)',color:'rgba(255,100,100,.8)',borderRadius:8,padding:'7px 14px',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit',flexShrink:0}}>Remove</button>
                </div>
              ))}
            </>)}
          </>)}

          {/* ── ABOUT TAB ── */}
          {focusedTab===4&&[
            {label:'Version',        desc:'TV+ IPTV v2.0.0 — Enhanced Edition'},
            {label:'Platform',       desc:'Samsung Smart TV · Tizen 9 · 1920×1080'},
            {label:'Color key guide',desc:'🟥 Overlay  🟩 Search  🟦 Settings  🟡 Refresh'},
            {label:'Navigation',     desc:'← → Browse · ↑ Categories · CH± Prev/Next · 0-9 Direct · ★ Favorite · Long-press OK to edit channel'},
          ].map((item,idx)=>(
            <div key={idx} style={{padding:'18px 20px',borderRadius:14,marginBottom:6,background:'rgba(255,255,255,.025)',border:'1px solid rgba(255,255,255,.04)'}}>
              <p style={{color:'rgba(255,255,255,.82)',fontSize:17,fontWeight:600,marginBottom:4}}>{item.label}</p>
              <p style={{color:'rgba(255,255,255,.28)',fontSize:13,lineHeight:1.5}}>{item.desc}</p>
            </div>
          ))}
        </div>
        {/* Footer */}
        <div style={{height:52,flexShrink:0,borderTop:'1px solid rgba(255,255,255,.05)',display:'flex',alignItems:'center',justifyContent:'center',gap:32}}>
          {[['←→','Tab'],['↑↓','Move'],['OK','Toggle'],['BACK','Close']].map(([k,d])=>(
            <div key={k} style={{display:'flex',alignItems:'center',gap:8}}>
              <kbd style={{color:'rgba(255,255,255,.7)',fontSize:12,fontWeight:700,background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.13)',borderRadius:6,padding:'3px 9px',fontFamily:'inherit'}}>{k}</kbd>
              <span style={{color:'rgba(255,255,255,.22)',fontSize:12}}>{d}</span>
            </div>
          ))}
        </div>
      </div>
    </>
  );
}

function SRow({item,focused,onClick}) {
  return (
    <div onClick={onClick} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'18px 20px',borderRadius:14,marginBottom:6,gap:28,cursor:item.type==='info'?'default':'pointer',
      background:focused?'rgba(255,255,255,.09)':'rgba(255,255,255,.025)',border:`1.5px solid ${focused?'rgba(255,255,255,.3)':'rgba(255,255,255,.04)'}`,transition:'all .12s'}}>
      <div style={{flex:1,minWidth:0}}>
        <p style={{color:focused?'#fff':'rgba(255,255,255,.82)',fontSize:17,fontWeight:600,marginBottom:4,letterSpacing:'-.015em'}}>{item.label}</p>
        <p style={{color:'rgba(255,255,255,.28)',fontSize:13,lineHeight:1.5}}>{item.desc}</p>
      </div>
      <div style={{flexShrink:0}}>
        {item.type==='toggle'&&(
          <div style={{width:52,height:28,borderRadius:14,position:'relative',background:item.val?'rgba(255,255,255,.82)':'rgba(255,255,255,.1)',transition:'background .2s',boxShadow:item.val&&focused?'0 0 18px rgba(255,255,255,.22)':'none'}}>
            <div style={{position:'absolute',top:4,width:20,height:20,borderRadius:'50%',left:item.val?28:4,background:item.val?'#000':'rgba(255,255,255,.4)',transition:'left .18s cubic-bezier(.34,1.56,.64,1)',boxShadow:'0 1px 4px rgba(0,0,0,.5)'}}/>
          </div>
        )}
        {item.type==='cycle'&&<div style={{padding:'7px 16px',borderRadius:10,background:focused?'rgba(255,255,255,.14)':'rgba(255,255,255,.06)',border:`1px solid ${focused?'rgba(255,255,255,.25)':'rgba(255,255,255,.08)'}`,display:'flex',alignItems:'center',gap:10}}><span style={{color:'rgba(255,255,255,.85)',fontSize:14,fontWeight:600}}>{item.val}</span>{focused&&<span style={{color:'rgba(255,255,255,.28)',fontSize:11}}>OK</span>}</div>}
        {item.type==='action'&&<div style={{padding:'8px 20px',borderRadius:10,background:focused?'rgba(255,255,255,.16)':'rgba(255,255,255,.06)',border:`1px solid ${focused?'rgba(255,255,255,.3)':'rgba(255,255,255,.1)'}`,color:focused?'#fff':'rgba(255,255,255,.5)',fontSize:14,fontWeight:600,transition:'all .12s'}}>{item.actionLabel}</div>}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   VIDEO PLAYER COMPONENT
═══════════════════════════════════════════════════════════ */
function VideoPlayer({playerState,isBuffering,isMuted,currentChannel,isTizen}) {
  const isLoading=playerState===PS.LOADING, isPaused=playerState===PS.PAUSED, isIdle=playerState===PS.IDLE||playerState===PS.NONE;
  const hasError=playerState===PS.ERROR, spinning=isLoading||isBuffering;
  return (
    <div style={{position:'absolute',inset:0,zIndex:0,background:'#000'}}>
      {isTizen?(
        <object id="avplay-player" type="application/avplayer" style={{position:'absolute',inset:0,width:'100%',height:'100%'}}/>
      ):(
        <video id="avplay-video" playsInline autoPlay muted={isMuted} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'contain'}}/>
      )}
      {isIdle&&!currentChannel&&(
        <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse at 50% 42%,#101010 0%,#000 100%)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:24}}>
          <svg width="88" height="88" viewBox="0 0 88 88" fill="none" opacity=".12"><rect x="6" y="20" width="76" height="48" rx="10" stroke="white" strokeWidth="3.5"/><path d="M28 20V12M60 20V12" stroke="white" strokeWidth="3.5" strokeLinecap="round"/><rect x="34" y="68" width="20" height="8" rx="4" fill="white"/></svg>
          <p style={{color:'rgba(255,255,255,.15)',fontSize:24,fontWeight:500,letterSpacing:'-.02em'}}>Select a channel to start</p>
        </div>
      )}
      {spinning&&(
        <div style={{position:'absolute',inset:0,zIndex:5,background:'rgba(0,0,0,.5)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:22}}>
          <div className="spin" style={{width:56,height:56,borderRadius:'50%',border:'3px solid rgba(255,255,255,.08)',borderTopColor:'rgba(255,255,255,.75)'}}/>
          {currentChannel&&<div className="fade-in" style={{display:'flex',alignItems:'center',gap:14}}>
            <ChannelLogo src={currentChannel.logo} name={currentChannel.name} size={38} radius={9}/>
            <div><p style={{color:'rgba(255,255,255,.88)',fontWeight:600,fontSize:18}}>{currentChannel.name}</p><p style={{color:'rgba(255,255,255,.32)',fontSize:14,marginTop:3}}>Connecting…</p></div>
          </div>}
        </div>
      )}
      {isPaused&&(
        <div style={{position:'absolute',inset:0,zIndex:5,background:'rgba(0,0,0,.28)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{width:90,height:90,borderRadius:'50%',background:'rgba(255,255,255,.10)',border:'2px solid rgba(255,255,255,.28)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <PlayIcon/>
          </div>
        </div>
      )}
      {hasError&&(
        <div style={{position:'absolute',inset:0,zIndex:5,background:'rgba(0,0,0,.82)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:20}}>
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.35)" strokeWidth="1.5"><path strokeLinecap="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
          <div style={{textAlign:'center'}}><p style={{color:'rgba(255,255,255,.65)',fontWeight:600,fontSize:20}}>Stream unavailable</p><p style={{color:'rgba(255,255,255,.28)',fontSize:15,marginTop:8}}>Press OK to retry · select another channel</p></div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   LOADING SCREEN
═══════════════════════════════════════════════════════════ */
function LoadingScreen({progress,status,error,onRetry}) {
  return (
    <div style={{width:1920,height:1080,background:'#080808',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:52,fontFamily:'inherit'}}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:22}}>
        <div style={{width:108,height:108,borderRadius:28,background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.09)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="54" height="54" viewBox="0 0 54 54" fill="none">
            <rect x="4" y="14" width="46" height="29" rx="6" stroke="rgba(255,255,255,.6)" strokeWidth="2.5"/>
            <path d="M18 14V9M36 14V9" stroke="rgba(255,255,255,.25)" strokeWidth="2.5" strokeLinecap="round"/>
            <rect x="20" y="43" width="14" height="5" rx="2.5" fill="rgba(255,255,255,.15)"/>
            <line x1="11" y1="22" x2="43" y2="22" stroke="rgba(255,255,255,.07)" strokeWidth="1.5"/>
            <line x1="11" y1="28" x2="43" y2="28" stroke="rgba(255,255,255,.07)" strokeWidth="1.5"/>
            <line x1="11" y1="34" x2="43" y2="34" stroke="rgba(255,255,255,.07)" strokeWidth="1.5"/>
          </svg>
        </div>
        <div style={{textAlign:'center'}}>
          <p style={{color:'#fff',fontWeight:800,fontSize:42,letterSpacing:'-.04em',lineHeight:1}}>Telugu<span style={{color:'rgba(255,255,255,.25)',fontWeight:300}}>IPTV</span></p>
          <p style={{color:'rgba(255,255,255,.22)',fontSize:18,fontWeight:400,marginTop:10}}>Samsung Smart TV · Tizen 9</p>
        </div>
      </div>
      <div style={{width:380,display:'flex',flexDirection:'column',alignItems:'center',gap:16}}>
        {error?(<>
          <p style={{color:'rgba(255,255,255,.4)',fontSize:16,textAlign:'center',lineHeight:1.5}}>{error}</p>
          <button onClick={onRetry} style={{marginTop:8,padding:'14px 44px',borderRadius:12,background:'rgba(255,255,255,.09)',border:'1px solid rgba(255,255,255,.18)',color:'#fff',fontWeight:700,fontSize:17,cursor:'pointer',fontFamily:'inherit'}}>Retry</button>
        </>):(<>
          <div style={{width:'100%',height:2,borderRadius:99,background:'rgba(255,255,255,.07)',overflow:'hidden'}}>
            <div style={{height:'100%',borderRadius:99,background:'rgba(255,255,255,.65)',width:`${Math.max(2,progress)}%`,transition:'width .4s ease'}}/>
          </div>
          <p style={{color:'rgba(255,255,255,.25)',fontSize:15,fontWeight:400}}>{status}</p>
        </>)}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   OVERLAY COMPONENT
═══════════════════════════════════════════════════════════ */
function Overlay({visible,playerState,isMuted,currentChannel,onTogglePause,onToggleMute,channels,currentChannelIndex,focusedChannelIdx,onSelectChannel,categories,selectedCategory,onSelectCategory,focusedCatIdx,zone,onSettings,onSearch,clock,favorites,onToggleFav,onEditRequest}) {
  const showCats=zone==='cats';
  return (
    <div style={{position:'absolute',inset:0,zIndex:10,display:'flex',flexDirection:'column',opacity:visible?1:0,transition:'opacity .3s ease',pointerEvents:visible?'auto':'none'}}>
      <TopBar currentChannel={currentChannel} onSettings={onSettings} onSearch={onSearch} playerState={playerState} isMuted={isMuted} onToggleMute={onToggleMute} onTogglePause={onTogglePause} clock={clock}/>
      <div style={{flex:1}}/>
      {showCats&&<CategoryRow categories={categories} selectedCategory={selectedCategory} onSelect={onSelectCategory} focusedIdx={focusedCatIdx}/>}
      <ChannelStrip channels={channels} currentIndex={currentChannelIndex} focusedIndex={focusedChannelIdx} onSelect={onSelectChannel} favorites={favorites} onToggleFav={onToggleFav} onEditRequest={onEditRequest}/>
      <HintBar zone={zone}/>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   APP SHELL (scales 1920×1080 to any TV)
═══════════════════════════════════════════════════════════ */
function AppShell({children}) {
  const [scale,setScale]=useState(1);
  useEffect(()=>{
    function compute(){try{const sw=window.screen?.width||window.innerWidth||1920,sh=window.screen?.height||window.innerHeight||1080;setScale(Math.min(sw/1920,sh/1080));}catch{setScale(1);}}
    compute(); window.addEventListener('resize',compute);
    return()=>window.removeEventListener('resize',compute);
  },[]);
  return (
    <div style={{width:'100vw',height:'100vh',overflow:'hidden',background:'#000',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{width:1920,height:1080,position:'relative',overflow:'hidden',background:'#000',transform:`scale(${scale})`,transformOrigin:'center center',flexShrink:0}}>
        {children}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════════════ */
function fmtClock(d){try{return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});}catch{return '--:--';}}

function App() {
  /* ── Overlay auto-hide ── */
  const [overlayVisible, setOverlayVisible] = useState(true);
  const hideTimer  = useRef(null);
  const visibleRef = useRef(true);

  const wakeOverlay = useCallback(()=>{
    if (!visibleRef.current){visibleRef.current=true;setOverlayVisible(true);}
    clearTimeout(hideTimer.current);
    hideTimer.current=setTimeout(()=>{
      if (zoneRef.current!=='settings'&&zoneRef.current!=='search'){visibleRef.current=false;setOverlayVisible(false);}
    },HIDE_MS);
  },[]);

  useEffect(()=>{
    hideTimer.current=setTimeout(()=>{visibleRef.current=false;setOverlayVisible(false);},HIDE_MS);
    return()=>clearTimeout(hideTimer.current);
  },[]);

  /* ── Zone + focus (ref-backed) ── */
  const [zone,          setZone]         = useState('strip');
  const [focusedChIdx,  setFocusedChIdx] = useState(0);
  const [focusedCatIdx, setFocusedCatIdx]= useState(0);
  const zoneRef  = useRef('strip');
  const chIdxRef = useRef(0);
  const catIdxRef= useRef(0);

  const setZoneSync = z  =>{ zoneRef.current=z; setZone(z); };
  const setChSync   = fn =>setFocusedChIdx(p=>{ const n=typeof fn==='function'?fn(p):fn; chIdxRef.current=n; return n; });
  const setCatSync  = fn =>setFocusedCatIdx(p=>{ const n=typeof fn==='function'?fn(p):fn; catIdxRef.current=n; return n; });

  /* ── Settings sub-nav ── */
  const [settingsTab,  setSettingsTab]  = useState(0);
  const [settingsItem, setSettingsItem] = useState(0);
  const tabRef    = useRef(0);
  const itemRef   = useRef(0);
  const setTabSync  = t  =>{ tabRef.current=t; setSettingsTab(t); };
  const setItemSync = fn =>setSettingsItem(p=>{ const n=typeof fn==='function'?fn(p):fn; itemRef.current=n; return n; });
  const itemActionRef = useRef(null);

  /* ── Volume HUD ── */
  const [volHUDVisible, setVolHUDVisible] = useState(false);
  const volHUDTimer = useRef(null);
  const showVolHUD = ()=>{ setVolHUDVisible(true); clearTimeout(volHUDTimer.current); volHUDTimer.current=setTimeout(()=>setVolHUDVisible(false),VOL_HUD_MS); };
  useEffect(()=>()=>clearTimeout(volHUDTimer.current),[]);

  /* ── Clock ── */
  const [clock, setClock] = useState(()=>fmtClock(new Date()));
  useEffect(()=>{ const id=setInterval(()=>setClock(fmtClock(new Date())),20000); return()=>clearInterval(id); },[]);

  /* ── Channel number entry (digit keys) ── */
  const [digitBuffer, setDigitBuffer] = useState('');
  const digitTimer = useRef(null);
  const digitBufRef = useRef('');

  /* ── Channel edit modal ── */
  const [editingChannel, setEditingChannel] = useState(null);

  /* ── Playlist ── */
  const {
    filteredChannels, categories, loading, loadProgress, loadStatus, error,
    selectedCategory, setSelectedCategory,
    searchQuery, setSearchQuery,
    currentChannel, currentChannelIndex, selectChannel,
    refreshPlaylist, activeSourceId, setActiveSourceId,
    favorites, toggleFavorite,
    overrides, saveOverride,
  } = usePlaylist();

  const chRef   = useRef([]);
  const catsRef = useRef([]);
  chRef.current   = filteredChannels;
  catsRef.current = categories;

  /* ── AVPlay ── */
  const {playerState, isBuffering, isTizen, playChannel, togglePause, stop} = useAVPlay();

  /* ── Volume ── */
  const {volume, isMuted, volumeUp, volumeDown, toggleMute} = useVolume();

  const playRef   = useRef(playChannel);
  const selectRef = useRef(selectChannel);
  playRef.current   = playChannel;
  selectRef.current = selectChannel;

  /* Sync focusedChIdx with currentChannelIndex */
  useEffect(()=>{
    if (currentChannelIndex>=0){ chIdxRef.current=currentChannelIndex; setFocusedChIdx(currentChannelIndex); }
  },[currentChannelIndex]);

  /* ── Last channel memory — restore on startup ── */
  useEffect(()=>{
    if (loading) return;
    const last = storage.get(LAST_CH_KEY, null);
    if (!last) return;
    // If source matches, restore
    const cfg = storage.get(CFG_KEY,{});
    const curSource = cfg.playlistSource ?? DEFAULT_SOURCE_ID;
    if (last.sourceId === curSource && last.channelId) {
      const idx = filteredChannels.findIndex(ch=>ch.id===last.channelId);
      if (idx>=0) {
        const ch = filteredChannels[idx];
        selectRef.current(idx);
        chIdxRef.current=idx;
        setFocusedChIdx(idx);
        if (ch.url) playRef.current(ch.url, ch.name);
      }
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[loading]);

  /* ── Service Worker registration ── */
  useEffect(()=>{
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', {scope:'./'})
        .then(reg=>{ console.log('[SW] Registered', reg.scope); })
        .catch(err=>{ console.warn('[SW] Registration failed:', err); });
    }
  },[]);

  /* ── Handlers ── */
  const handleSelectChannel = useCallback((index)=>{
    const ch=chRef.current[index];
    if (!ch) return;
    selectRef.current(index);
    chIdxRef.current=index;
    setFocusedChIdx(index);
    if (ch.url) playRef.current(ch.url, ch.name);
    // Save last channel
    const cfg=storage.get(CFG_KEY,{});
    storage.set(LAST_CH_KEY,{sourceId:cfg.playlistSource??DEFAULT_SOURCE_ID,channelId:ch.id,index});
    wakeOverlay();
  },[wakeOverlay]);

  const handleSelectCategory = useCallback((cat)=>{
    setSelectedCategory(cat);
    const idx=catsRef.current.findIndex(c=>c.name===cat);
    if (idx>=0){ catIdxRef.current=idx; setFocusedCatIdx(idx); }
    chIdxRef.current=0; setFocusedChIdx(0); selectRef.current(-1);
  },[setSelectedCategory]);

  const openSettings = useCallback(()=>{ wakeOverlay(); setZoneSync('settings'); setTabSync(0); setItemSync(0); },[wakeOverlay]);
  const openSearch   = useCallback(()=>{ wakeOverlay(); setZoneSync('search'); },[wakeOverlay]);

  /* ── Digit channel jump ── */
  const handleDigit = useCallback((d)=>{
    wakeOverlay();
    clearTimeout(digitTimer.current);
    const next = digitBufRef.current + String(d);
    digitBufRef.current = next;
    setDigitBuffer(next);

    digitTimer.current = setTimeout(()=>{
      const target = parseInt(digitBufRef.current, 10) - 1; // 1-based → 0-based
      digitBufRef.current = '';
      setDigitBuffer('');
      const chs = chRef.current;
      if (target>=0 && target<chs.length) {
        handleSelectChannel(target);
      }
    }, DIGIT_TIMEOUT);
  },[wakeOverlay, handleSelectChannel]);

  /* ── Remote control ── */
  useRemoteControl({
    onAnyKey: ()=>wakeOverlay(),
    onUp: ()=>{
      const z=zoneRef.current;
      if (z==='settings'){ setItemSync(i=>Math.max(0,i-1)); return; }
      if (z==='strip')   { setZoneSync('cats'); return; }
    },
    onDown: ()=>{
      const z=zoneRef.current;
      if (z==='settings'){ setItemSync(i=>Math.min(SETTINGS_ITEM_COUNT(tabRef.current)-1,i+1)); return; }
      if (z==='cats')    { setZoneSync('strip'); return; }
    },
    onLeft: ()=>{
      const z=zoneRef.current;
      if (z==='strip')   { setChSync(i=>Math.max(0,i-1)); return; }
      if (z==='cats')    { setCatSync(i=>{ const n=Math.max(0,i-1); const c=catsRef.current[n]; if(c)handleSelectCategory(c.name); return n; }); return; }
      if (z==='settings'){ const t=Math.max(0,tabRef.current-1); setTabSync(t); setItemSync(0); return; }
    },
    onRight: ()=>{
      const z=zoneRef.current;
      if (z==='strip')   { setChSync(i=>Math.min(chRef.current.length-1,i+1)); return; }
      if (z==='cats')    { setCatSync(i=>{ const n=Math.min(catsRef.current.length-1,i+1); const c=catsRef.current[n]; if(c)handleSelectCategory(c.name); return n; }); return; }
      if (z==='settings'){ const t=Math.min(SETTINGS_TAB_COUNT-1,tabRef.current+1); setTabSync(t); setItemSync(0); return; }
    },
    onEnter: ()=>{
      const z=zoneRef.current;
      if (z==='strip')   { handleSelectChannel(chIdxRef.current); return; }
      if (z==='cats')    { setZoneSync('strip'); return; }
      if (z==='settings'){ itemActionRef.current?.(tabRef.current,itemRef.current); return; }
    },
    onBack: ()=>{
      const z=zoneRef.current;
      if (z==='settings')   { setZoneSync('strip'); return; }
      if (z==='cats')       { setZoneSync('strip'); return; }
      if (z==='search')     { setSearchQuery(''); setZoneSync('strip'); return; }
      if (editingChannel)   { setEditingChannel(null); return; }
    },
    onSettings:  ()=>{ const z=zoneRef.current; z==='settings'?setZoneSync('strip'):openSettings(); },
    onPlayPause: ()=>togglePause(),
    onStop:      ()=>stop(),
    onChannelUp: ()=>{
      setChSync(i=>{ const n=Math.min(chRef.current.length-1,i+1); const ch=chRef.current[n]; if(ch){selectRef.current(n);playRef.current(ch.url,ch.name);storage.set(LAST_CH_KEY,{sourceId:storage.get(CFG_KEY,{}).playlistSource??DEFAULT_SOURCE_ID,channelId:ch.id,index:n});} return n; });
    },
    onChannelDown: ()=>{
      setChSync(i=>{ const n=Math.max(0,i-1); const ch=chRef.current[n]; if(ch){selectRef.current(n);playRef.current(ch.url,ch.name);storage.set(LAST_CH_KEY,{sourceId:storage.get(CFG_KEY,{}).playlistSource??DEFAULT_SOURCE_ID,channelId:ch.id,index:n});} return n; });
    },
    onVolumeUp:   ()=>{ volumeUp();   showVolHUD(); },
    onVolumeDown: ()=>{ volumeDown(); showVolHUD(); },
    onMute:       ()=>{ toggleMute(); showVolHUD(); },
    onYellow:     ()=>refreshPlaylist(),
    onRed: ()=>{
      if (visibleRef.current){clearTimeout(hideTimer.current);visibleRef.current=false;setOverlayVisible(false);}
      else wakeOverlay();
    },
    onGreen: ()=>{ const z=zoneRef.current; if(z==='search'){setSearchQuery('');setZoneSync('strip');}else openSearch(); },
    onBlue:  ()=>{ const z=zoneRef.current; z==='settings'?setZoneSync('strip'):openSettings(); },
    onDigit: (d)=>handleDigit(d),
    onInfo:    ()=>{},
    onForward: ()=>{},
    onRewind:  ()=>{},
    onExit:    ()=>{},
  }, !loading);

  const handleEditRequest = useCallback((idx)=>{
    const ch = chRef.current[idx];
    if (ch) setEditingChannel(ch);
  },[]);

  const handleSaveEdit = useCallback((chId, data)=>{
    saveOverride(chId, data);
    setEditingChannel(null);
  },[saveOverride]);

  /* ── Loading screen ── */
  if (loading) {
    return (<AppShell><LoadingScreen progress={loadProgress} status={loadStatus} error={error} onRetry={refreshPlaylist}/></AppShell>);
  }

  const settingsOpen = zone==='settings';
  const searchOpen   = zone==='search';

  return (
    <AppShell>
      {/* ① Video */}
      <VideoPlayer playerState={playerState} isBuffering={isBuffering} isMuted={isMuted} currentChannel={currentChannel} isTizen={isTizen}/>

      {/* ② Overlay */}
      <Overlay
        visible={overlayVisible||settingsOpen||searchOpen}
        playerState={playerState} isMuted={isMuted} currentChannel={currentChannel}
        onTogglePause={togglePause} onToggleMute={()=>{toggleMute();showVolHUD();}}
        channels={filteredChannels} currentChannelIndex={currentChannelIndex}
        focusedChannelIdx={focusedChIdx} onSelectChannel={handleSelectChannel}
        categories={categories} selectedCategory={selectedCategory}
        onSelectCategory={handleSelectCategory} focusedCatIdx={focusedCatIdx}
        zone={settingsOpen||searchOpen?'strip':zone}
        onSettings={openSettings} onSearch={openSearch} clock={clock}
        favorites={favorites} onToggleFav={toggleFavorite}
        onEditRequest={handleEditRequest}
      />

      {/* ③ Volume HUD */}
      <VolumeHUD volume={volume} isMuted={isMuted} visible={volHUDVisible}/>

      {/* ④ Channel number OSD */}
      {digitBuffer&&<ChannelNumberOSD digits={digitBuffer} total={filteredChannels.length}/>}

      {/* ⑤ Search */}
      <SearchOverlay isOpen={searchOpen} query={searchQuery} onQueryChange={setSearchQuery}
        onClose={()=>{ setSearchQuery(''); setZoneSync('strip'); }} resultCount={filteredChannels.length}/>

      {/* ⑥ Settings */}
      <SettingsPanel isOpen={settingsOpen} onClose={()=>setZoneSync('strip')}
        onRefreshPlaylist={()=>{ setZoneSync('strip'); refreshPlaylist(); }}
        focusedTab={settingsTab} focusedItem={settingsItem}
        onTabChange={t=>{ setTabSync(t); setItemSync(0); }}
        onItemAction={itemActionRef}
        activeSourceId={activeSourceId}
        onSourceChange={(id)=>{ setActiveSourceId(id); setZoneSync('strip'); }}
      />

      {/* ⑦ Channel edit modal */}
      {editingChannel&&(
        <ChannelEditModal
          channel={editingChannel}
          onSave={(data)=>handleSaveEdit(editingChannel.id, data)}
          onCancel={()=>setEditingChannel(null)}
        />
      )}
    </AppShell>
  );
}

/* ═══════════════════════════════════════════════════════════
   MOUNT
═══════════════════════════════════════════════════════════ */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
