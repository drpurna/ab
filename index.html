<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Telugu IPTV</title>
  <link rel="icon" href="./icon.jpg">
  <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;user-select:none;outline:none}
    body,html,#root{width:100vw;height:100vh;overflow:hidden;background:#000;font-family:'Inter',system-ui,sans-serif}
    ::-webkit-scrollbar{display:none}
    @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
    @keyframes slideUp{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
    @keyframes spinAnim{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
    .fade-in{animation:fadeIn .22s ease both}
    .slide-up{animation:slideUp .28s cubic-bezier(0.16,1,0.3,1) both}
    .spin{animation:spinAnim .85s linear infinite}
    .blink{animation:blink 1.6s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.15}}
    kbd{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:3px 9px;font-size:12px;color:#fff}
  </style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React from 'https://esm.sh/react@18.2.0?target=es2020';
import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client?target=es2020';
const { useState, useEffect, useRef, useCallback, useMemo, useLayoutEffect } = React;

// ---------- CONSTANTS ----------
const STORAGE_CFG = 'tiptv_cfg';
const STORAGE_FAVS = 'tiptv_favs';
const DEFAULT_CUSTOM_URL = 'https://jioplaylist.joinus-apiworker.workers.dev/playlist.m3u';

const PLAYLISTS = [
  { id: 'tel', label: 'Telugu Only', desc: 'Telugu language channels', url: 'https://iptv-org.github.io/iptv/languages/tel.m3u' },
  { id: 'india', label: 'India — All', desc: 'All Indian channels', url: 'https://iptv-org.github.io/iptv/countries/in.m3u' },
  { id: 'custom', label: 'Custom', desc: 'Your own playlist URL', url: DEFAULT_CUSTOM_URL }
];

// ---------- HELPERS ----------
function parseExtInf(line) {
  const safe = (re) => { try { return line.match(re)?.[1]?.trim() ?? ''; } catch { return ''; } };
  const lastComma = line.lastIndexOf(',');
  const displayName = lastComma >= 0 ? line.slice(lastComma + 1).trim() : '';
  return {
    id: '',
    name: (safe(/tvg-name="([^"]*)"/) || displayName || 'Unknown').trim(),
    logo: safe(/tvg-logo="([^"]*)"/),
    group: (safe(/group-title="([^"]*)"/) || 'General').trim(),
    url: ''
  };
}

function parseM3U(text) {
  const channels = [];
  let current = null;
  const lines = text.split(/\r?\n/);
  for (const line of lines) {
    const l = line.trim();
    if (!l) continue;
    if (l.startsWith('#EXTINF:')) {
      current = parseExtInf(l);
    } else if (l.startsWith('#')) {
      continue;
    } else if (current && (l.startsWith('http') || l.startsWith('rtmp'))) {
      current.url = l;
      current.id = `ch_${channels.length}`;
      channels.push({ ...current });
      current = null;
    }
  }
  return channels;
}

async function fetchM3U(url) {
  const proxies = [
    u => u,
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`
  ];
  for (const proxy of proxies) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    try {
      const res = await fetch(proxy(url), { signal: controller.signal, headers: { Accept: 'application/x-mpegurl, */*' } });
      clearTimeout(timer);
      if (res.ok) {
        const txt = await res.text();
        if (txt.includes('#EXTINF') || txt.includes('#EXTM3U')) return txt;
      }
    } catch { clearTimeout(timer); }
  }
  return null;
}

const storage = {
  get(key, def = null) { try { const v = localStorage.getItem(key); return v === null ? def : JSON.parse(v); } catch { return def; } },
  set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch { return false; } }
};

function getFavourites() { return storage.get(STORAGE_FAVS, []); }
function isFavourite(channel) { return channel ? getFavourites().includes(channel.url) : false; }
function toggleFavourite(channel) {
  if (!channel) return;
  let favs = getFavourites();
  const idx = favs.indexOf(channel.url);
  if (idx === -1) favs.push(channel.url);
  else favs.splice(idx, 1);
  storage.set(STORAGE_FAVS, favs);
  return favs;
}

// ---------- MAIN APP ----------
function App() {
  // Config
  const [config, setConfig] = useState(() => {
    const def = {
      playlistSource: 'tel', cacheOn: true, cacheTTL: 1, bufferSize: 1, quality: 0,
      autoplay: true, muteOnStart: false, customUrl: DEFAULT_CUSTOM_URL, showBug: true
    };
    const saved = storage.get(STORAGE_CFG, {});
    return { ...def, ...saved };
  });
  useEffect(() => { storage.set(STORAGE_CFG, config); }, [config]);

  // Update custom URL in PLAYLISTS
  useEffect(() => {
    const custom = PLAYLISTS.find(p => p.id === 'custom');
    if (custom) custom.url = config.customUrl || DEFAULT_CUSTOM_URL;
  }, [config.customUrl]);

  const [activeSourceId, setActiveSourceId] = useState(config.playlistSource);
  const [channels, setChannels] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadProgress, setLoadProgress] = useState(0);
  const [loadStatus, setLoadStatus] = useState('Loading…');
  const [error, setError] = useState(null);

  const loadPlaylist = useCallback(async (force = false) => {
    const source = PLAYLISTS.find(p => p.id === activeSourceId);
    if (!source) return;
    setLoading(true); setError(null); setLoadProgress(5); setLoadStatus(`Fetching ${source.label}…`);
    const cacheKey = `playlist_${activeSourceId}`;
    const cached = (!force && config.cacheOn) ? storage.get(cacheKey) : null;
    const ttl = [3600000, 21600000, 43200000, 86400000][config.cacheTTL];
    if (cached && (Date.now() - cached.timestamp) < ttl) {
      setChannels(cached.channels);
      setLoading(false); setLoadProgress(100); setLoadStatus(`${cached.channels.length} channels (cached)`);
      return;
    }
    const m3u = await fetchM3U(source.url);
    if (!m3u) { setError(`Failed to load ${source.label}`); setLoading(false); return; }
    setLoadProgress(50); setLoadStatus('Parsing channels…');
    const parsed = parseM3U(m3u);
    if (!parsed.length) { setError('No channels found'); setLoading(false); return; }
    setChannels(parsed);
    if (config.cacheOn) storage.set(cacheKey, { channels: parsed, timestamp: Date.now() });
    setLoading(false); setLoadProgress(100); setLoadStatus(`${parsed.length} channels ready`);
  }, [activeSourceId, config.cacheOn, config.cacheTTL]);

  useEffect(() => { loadPlaylist(false); }, [loadPlaylist]);

  // Categories
  const categories = useMemo(() => {
    const map = new Map();
    for (const ch of channels) {
      const g = ch.group || 'General';
      map.set(g, (map.get(g) || 0) + 1);
    }
    const arr = Array.from(map.entries()).map(([name, count]) => ({ name, count, icon: getIcon(name) }));
    return [{ name: 'All', count: channels.length, icon: '📺' }, ...arr.sort((a,b) => b.count - a.count)];
  }, [channels]);
  function getIcon(name) {
    const n = name.toLowerCase();
    if (n.includes('news')) return '📰';
    if (n.includes('movie')) return '🎬';
    if (n.includes('music')) return '🎵';
    if (n.includes('sport')) return '🏏';
    if (n.includes('kids')) return '🧒';
    if (n.includes('entertain')) return '🎭';
    return '📡';
  }

  const [selectedCategory, setSelectedCategory] = useState('All');
  const [searchQuery, setSearchQuery] = useState('');
  const filteredChannels = useMemo(() => {
    let list = selectedCategory === 'All' ? channels : channels.filter(ch => (ch.group || 'General') === selectedCategory);
    if (searchQuery) list = list.filter(ch => ch.name.toLowerCase().includes(searchQuery.toLowerCase()));
    return list;
  }, [channels, selectedCategory, searchQuery]);

  // Player state
  const [playerState, setPlayerState] = useState('IDLE');
  const [isBuffering, setIsBuffering] = useState(false);
  const isTizen = typeof window !== 'undefined' && !!window.webapis?.avplay;
  const avplayRef = useRef(null);
  const videoRef = useRef(null);
  const [volume, setVolume] = useState(() => { try { return isTizen ? window.webapis.tvaudiocontrol.getVolume() : 50; } catch { return 50; } });
  const [isMuted, setIsMuted] = useState(() => { try { return isTizen ? window.webapis.tvaudiocontrol.isMute() : false; } catch { return false; } });

  const stopPlayer = useCallback(() => {
    if (isTizen && avplayRef.current) {
      try { avplayRef.current.stop(); avplayRef.current.close(); } catch(e) {}
    } else if (videoRef.current) {
      videoRef.current.pause();
      videoRef.current.src = '';
    }
    setPlayerState('IDLE');
    setIsBuffering(false);
  }, [isTizen]);

  const applyBuffer = useCallback((player) => {
    if (!isTizen || !player) return;
    const bufSec = [2,5,10][config.bufferSize] || 5;
    try { player.setStreamingProperty?.('BUFFER_SIZE', String(bufSec * 1000)); } catch(e) {}
  }, [isTizen, config.bufferSize]);

  const playChannel = useCallback(async (ch, idx) => {
    if (!ch?.url) return;
    setCurrentChannelIndex(idx);
    setFocusedChannelIdx(idx);
    setPlayerState('LOADING');
    setIsBuffering(true);
    if (isTizen) {
      try {
        const player = window.webapis.avplay;
        avplayRef.current = player;
        const state = player.getState();
        if (state !== 'NONE' && state !== 'IDLE') { player.stop(); player.close(); }
        player.open(ch.url);
        player.setDisplayRect(0, 0, 1920, 1080);
        player.setDisplayMethod('PLAYER_DISPLAY_MODE_FULL_SCREEN');
        applyBuffer(player);
        player.setListener({
          onbufferingstart: () => setIsBuffering(true),
          onbufferingcomplete: () => { setIsBuffering(false); setPlayerState('PLAYING'); },
          onerror: (e) => { console.error(e); setPlayerState('ERROR'); setIsBuffering(false); },
          onstreamcompleted: () => setPlayerState('IDLE')
        });
        player.prepare();
        player.play();
        setPlayerState('PLAYING');
        setIsBuffering(false);
      } catch(e) { setPlayerState('ERROR'); setIsBuffering(false); }
    } else {
      const vid = document.createElement('video');
      videoRef.current = vid;
      vid.src = ch.url;
      vid.autoplay = true;
      vid.muted = config.muteOnStart || isMuted;
      vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain';
      document.getElementById('video-container')?.appendChild(vid);
      vid.oncanplay = () => { setIsBuffering(false); setPlayerState('PLAYING'); };
      vid.onwaiting = () => setIsBuffering(true);
      vid.onerror = () => { setPlayerState('ERROR'); setIsBuffering(false); };
      try { await vid.play(); } catch(e) { setPlayerState('ERROR'); }
    }
    if (overlayTimer.current) clearTimeout(overlayTimer.current);
    setOverlayVisible(true);
    overlayTimer.current = setTimeout(() => setOverlayVisible(false), 5000);
  }, [isTizen, config.bufferSize, config.muteOnStart, isMuted, applyBuffer]);

  const togglePause = useCallback(() => {
    if (isTizen && avplayRef.current) {
      const st = avplayRef.current.getState();
      if (st === 'PLAYING') { avplayRef.current.pause(); setPlayerState('PAUSED'); }
      else if (st === 'PAUSED') { avplayRef.current.play(); setPlayerState('PLAYING'); }
    } else if (videoRef.current) {
      if (videoRef.current.paused) { videoRef.current.play(); setPlayerState('PLAYING'); }
      else { videoRef.current.pause(); setPlayerState('PAUSED'); }
    }
  }, [isTizen]);

  const toggleMute = useCallback(() => {
    const newMute = !isMuted;
    if (isTizen) { try { window.webapis.tvaudiocontrol.setMute(newMute); } catch {} }
    else if (videoRef.current) videoRef.current.muted = newMute;
    setIsMuted(newMute);
    setVolumeOSDvisible(true); setTimeout(() => setVolumeOSDvisible(false), 1500);
  }, [isMuted, isTizen]);

  const volumeUp = useCallback(() => {
    let newVol = Math.min(100, volume + 5);
    if (isTizen) { try { window.webapis.tvaudiocontrol.setVolume(newVol); } catch {} }
    else if (videoRef.current) videoRef.current.volume = newVol / 100;
    setVolume(newVol);
    setVolumeOSDvisible(true); setTimeout(() => setVolumeOSDvisible(false), 1500);
  }, [volume, isTizen]);

  const volumeDown = useCallback(() => {
    let newVol = Math.max(0, volume - 5);
    if (isTizen) { try { window.webapis.tvaudiocontrol.setVolume(newVol); } catch {} }
    else if (videoRef.current) videoRef.current.volume = newVol / 100;
    setVolume(newVol);
    setVolumeOSDvisible(true); setTimeout(() => setVolumeOSDvisible(false), 1500);
  }, [volume, isTizen]);

  // Favourites UI
  const [favs, setFavs] = useState(getFavourites());
  const refreshFavs = useCallback(() => setFavs(getFavourites()), []);
  const toggleFavCurrent = useCallback(() => {
    const ch = filteredChannels[focusedChannelIdx];
    if (ch) { toggleFavourite(ch); refreshFavs(); }
  }, [filteredChannels, focusedChannelIdx, refreshFavs]);

  // Navigation state
  const [currentChannelIndex, setCurrentChannelIndex] = useState(-1);
  const [focusedChannelIdx, setFocusedChannelIdx] = useState(0);
  const [focusedCatIdx, setFocusedCatIdx] = useState(0);
  const [uiZone, setUiZone] = useState('strip'); // strip, cats, settings, search
  const [settingsVisible, setSettingsVisible] = useState(false);
  const [settingsTab, setSettingsTab] = useState(0);
  const [settingsItemIdx, setSettingsItemIdx] = useState(0);
  const [searchVisible, setSearchVisible] = useState(false);
  const [volumeOSDvisible, setVolumeOSDvisible] = useState(false);
  const [overlayVisible, setOverlayVisible] = useState(true);
  const overlayTimer = useRef(null);
  const [numericDigits, setNumericDigits] = useState('');
  const [numericVisible, setNumericVisible] = useState(false);
  const [clock, setClock] = useState(new Date().toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12:true }));
  useEffect(() => {
    const iv = setInterval(() => setClock(new Date().toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12:true })), 20000);
    return () => clearInterval(iv);
  }, []);

  // Numeric input
  useEffect(() => {
    const handler = (e) => {
      const code = e.keyCode;
      if (code >= 48 && code <= 57) {
        e.preventDefault();
        const digit = code - 48;
        setNumericDigits(prev => {
          let newDigits = (prev + digit).slice(0, 3);
          setNumericVisible(true);
          if (overlayTimer.current) clearTimeout(overlayTimer.current);
          overlayTimer.current = setTimeout(() => {
            const num = parseInt(newDigits, 10);
            if (!isNaN(num) && num >= 1 && num <= filteredChannels.length) {
              const targetIdx = num - 1;
              playChannel(filteredChannels[targetIdx], targetIdx);
              setFocusedChannelIdx(targetIdx);
            }
            setNumericDigits('');
            setNumericVisible(false);
          }, 1000);
          return newDigits;
        });
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [filteredChannels, playChannel]);

  // Remote keys
  useEffect(() => {
    const keyHandler = (e) => {
      const key = e.keyCode;
      if (overlayTimer.current) clearTimeout(overlayTimer.current);
      setOverlayVisible(true);
      overlayTimer.current = setTimeout(() => setOverlayVisible(false), 5000);

      if (settingsVisible) {
        if (key === 10009 || key === 27) { setSettingsVisible(false); setUiZone('strip'); return; }
        if (key === 38 || key === 40) {
          const max = (settingsTab === 0 ? PLAYLISTS.length + 4 : settingsTab === 1 ? 4 : 2);
          if (key === 38) setSettingsItemIdx(p => Math.max(0, p-1));
          else setSettingsItemIdx(p => Math.min(max-1, p+1));
          return;
        }
        if (key === 37 || key === 39) {
          if (key === 37) setSettingsTab(p => Math.max(0, p-1));
          else setSettingsTab(p => Math.min(2, p+1));
          setSettingsItemIdx(0);
          return;
        }
        if (key === 13) {
          const idx = settingsItemIdx;
          if (settingsTab === 0) {
            if (idx < PLAYLISTS.length) {
              const newSrc = PLAYLISTS[idx].id;
              setActiveSourceId(newSrc);
              setConfig(c => ({ ...c, playlistSource: newSrc }));
              setSettingsVisible(false);
              setUiZone('strip');
            } else {
              const off = idx - PLAYLISTS.length;
              if (off === 0) setConfig(c => ({ ...c, cacheOn: !c.cacheOn }));
              else if (off === 1) setConfig(c => ({ ...c, cacheTTL: (c.cacheTTL+1)%4 }));
              else if (off === 2) {
                const newUrl = prompt('Enter custom playlist URL:', config.customUrl);
                if (newUrl) setConfig(c => ({ ...c, customUrl: newUrl }));
              }
              else if (off === 3) loadPlaylist(true);
            }
          } else if (settingsTab === 1) {
            if (idx === 0) setConfig(c => ({ ...c, autoplay: !c.autoplay }));
            else if (idx === 1) setConfig(c => ({ ...c, muteOnStart: !c.muteOnStart }));
            else if (idx === 2) setConfig(c => ({ ...c, bufferSize: (c.bufferSize+1)%3 }));
            else if (idx === 3) setConfig(c => ({ ...c, quality: (c.quality+1)%4 }));
          } else if (settingsTab === 2) {
            if (idx === 0) setConfig(c => ({ ...c, showBug: !c.showBug }));
          }
          return;
        }
        return;
      }

      if (searchVisible) {
        if (key === 10009 || key === 27) { setSearchVisible(false); setSearchQuery(''); setUiZone('strip'); return; }
        return;
      }

      // Main navigation
      if (key === 38) { // Up
        if (uiZone === 'strip') setUiZone('cats');
        else if (uiZone === 'cats') setUiZone('strip');
        return;
      }
      if (key === 40) { // Down
        if (uiZone === 'cats') setUiZone('strip');
        return;
      }
      if (key === 37) { // Left
        if (uiZone === 'strip') setFocusedChannelIdx(p => Math.max(0, p-1));
        else if (uiZone === 'cats') {
          const ni = Math.max(0, focusedCatIdx-1);
          setFocusedCatIdx(ni);
          setSelectedCategory(categories[ni]?.name || 'All');
        }
        return;
      }
      if (key === 39) { // Right
        if (uiZone === 'strip') setFocusedChannelIdx(p => Math.min(filteredChannels.length-1, p+1));
        else if (uiZone === 'cats') {
          const ni = Math.min(categories.length-1, focusedCatIdx+1);
          setFocusedCatIdx(ni);
          setSelectedCategory(categories[ni]?.name || 'All');
        }
        return;
      }
      if (key === 13) { // OK
        if (uiZone === 'strip' && filteredChannels[focusedChannelIdx])
          playChannel(filteredChannels[focusedChannelIdx], focusedChannelIdx);
        return;
      }
      if (key === 10009 || key === 27) { // BACK
        if (uiZone !== 'strip') { setUiZone('strip'); setSearchVisible(false); setSettingsVisible(false); }
        else if (playerState === 'PLAYING') stopPlayer();
        return;
      }
      if (key === 403) { setOverlayVisible(v => !v); return; }      // RED
      if (key === 404) { setSearchVisible(true); setUiZone('search'); return; } // GREEN
      if (key === 405) { loadPlaylist(true); return; }               // YELLOW
      if (key === 406) { setSettingsVisible(true); setUiZone('settings'); return; } // BLUE
      if (key === 457) { toggleFavCurrent(); return; }               // INFO
      if (key === 427) { // CH UP
        const ni = Math.min(filteredChannels.length-1, focusedChannelIdx+1);
        playChannel(filteredChannels[ni], ni);
        return;
      }
      if (key === 428) { // CH DOWN
        const ni = Math.max(0, focusedChannelIdx-1);
        playChannel(filteredChannels[ni], ni);
        return;
      }
      if (key === 447) volumeUp();
      if (key === 448) volumeDown();
      if (key === 449) toggleMute();
      if (key === 415 || key === 10252) togglePause();
      if (key === 413) stopPlayer();
    };
    window.addEventListener('keydown', keyHandler);
    return () => window.removeEventListener('keydown', keyHandler);
  }, [uiZone, filteredChannels, focusedChannelIdx, focusedCatIdx, categories, playChannel, stopPlayer, togglePause, volumeUp, volumeDown, toggleMute, loadPlaylist, toggleFavCurrent, settingsVisible, searchVisible, config, setConfig, setActiveSourceId, setSettingsVisible, setSearchVisible, setUiZone, setFocusedChannelIdx, setFocusedCatIdx, setSelectedCategory, setSearchQuery, setOverlayVisible, playerState]);

  // ---------- UI Components ----------
  const PlayerView = () => React.createElement('div', { id: 'video-container', style: { position: 'absolute', inset: 0, background: '#000' } },
    isTizen ? React.createElement('object', { id: 'avplay-player', type: 'application/avplayer', style: { width: '100%', height: '100%' } }) : null
  );

  const IconBtn = ({ onClick, children, title }) => React.createElement('button', { onClick, title, style: { width: 42, height: 42, borderRadius: 11, background: 'rgba(255,255,255,0.06)', border: '1.5px solid rgba(255,255,255,0.09)', color: '#fff', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20 } }, children);

  const TopBar = () => React.createElement('div', { style: { position: 'absolute', top: 0, left: 0, right: 0, height: 80, padding: '0 60px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'linear-gradient(to bottom, rgba(0,0,0,0.92), transparent)', zIndex: 20 } },
    React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
      React.createElement('span', { style: { color: '#fff', fontWeight: 900, fontSize: 34 } }, 'TV'),
      React.createElement('span', { style: { color: 'rgba(255,255,255,0.85)', fontSize: 36, fontWeight: 300 } }, '+')
    ),
    React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 12 } },
      React.createElement(IconBtn, { onClick: toggleFavCurrent, title: 'Favourite' }, favs.includes(filteredChannels[focusedChannelIdx]?.url) ? '❤️' : '🤍'),
      React.createElement(IconBtn, { onClick: () => setSearchVisible(true), title: 'Search' }, '🔍'),
      React.createElement(IconBtn, { onClick: toggleMute, title: 'Mute' }, isMuted ? '🔇' : '🔊'),
      React.createElement(IconBtn, { onClick: togglePause, title: 'Play/Pause' }, playerState === 'PLAYING' ? '⏸' : '▶️'),
      React.createElement(IconBtn, { onClick: () => setSettingsVisible(true), title: 'Settings' }, '⚙️'),
      React.createElement('div', { style: { color: 'rgba(255,255,255,0.6)', fontSize: 17, fontWeight: 500 } }, clock)
    )
  );

  const ChannelCard = ({ channel, idx, isFocused, isPlaying, isFav, onSelect }) => {
    const [imgErr, setImgErr] = useState(false);
