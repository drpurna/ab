(function(){

    useCallback=R.useCallback, useMemo=R.useMemo, useLayoutEffect=R.useLayoutEffect;

/* ── Constants ─────────────────────────────── */
var HIDE_MS=5000, VOL_MS=2000, DIGIT_MS=2000;
var CARD_W=252, CARD_H=290, GAP=28, STEP=CARD_W+GAP;
var CX=960, CARD_L=CX-CARD_W/2, RING_PAD=5;
var PS={NONE:'NONE',IDLE:'IDLE',LOADING:'LOADING',PLAYING:'PLAYING',PAUSED:'PAUSED',ERROR:'ERROR'};

/* ── Storage ────────────────────────────────── */
var LS={
  get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};

/* ── IndexedDB ──────────────────────────────── */
var _db=null;
function openDB(cb){
  if(_db){cb(_db);return;}
  var req=indexedDB.open('TIPTV2',2);
  req.onupgradeneeded=function(e){
    var db=e.target.result;
    if(!db.objectStoreNames.contains('pl'))db.createObjectStore('pl',{keyPath:'id'});
  };
  req.onsuccess=function(e){_db=e.target.result;cb(_db);};
  req.onerror=function(){cb(null);};
}
function idbGet(key,cb){
  openDB(function(db){
    if(!db){cb(null);return;}
    try{
      var tx=db.transaction('pl','readonly');
      var req=tx.objectStore('pl').get(key);
      req.onsuccess=function(e){cb(e.target.result||null);};
      req.onerror=function(){cb(null);};
    }catch(e){cb(null);}
  });
}
function idbPut(val,cb){
  openDB(function(db){
    if(!db){if(cb)cb(false);return;}
    try{
      var tx=db.transaction('pl','readwrite');
      tx.objectStore('pl').put(val);
      if(cb)cb(true);
    }catch(e){if(cb)cb(false);}
  });
}

/* ── Playlist sources ───────────────────────── */
var SOURCES=[
  {id:'tel',   label:'Telugu',       desc:'Telugu language channels',          url:'https://iptv-org.github.io/iptv/languages/tel.m3u'},
  {id:'india', label:'India — All',  desc:'All Indian channels (~800)',         url:'https://iptv-org.github.io/iptv/countries/in.m3u'},
  {id:'sports',label:'Sports',       desc:'Sports channels worldwide',          url:'https://iptv-org.github.io/iptv/categories/sports.m3u'},
  {id:'news',  label:'News',         desc:'News channels worldwide',            url:'https://iptv-org.github.io/iptv/categories/news.m3u'},
  {id:'ent',   label:'Entertainment',desc:'Entertainment channels worldwide',   url:'https://iptv-org.github.io/iptv/categories/entertainment.m3u'}
];
var DEF_SRC='tel';
var CFG_KEY='tiptv_cfg_v5';
var CUST_KEY='tiptv_custom_srcs';
var FAV_KEY='tiptv_favs';
var LAST_KEY='tiptv_last';
var OVR_KEY='tiptv_overrides';

function getAllSources(){return SOURCES.concat(LS.get(CUST_KEY,[]));}
function getSrcById(id){return getAllSources().find(function(s){return s.id===id;})||SOURCES[0];}

/* ── M3U parser ─────────────────────────────── */
var PROXIES=[
  function(u){return u;},
  function(u){return'https://corsproxy.io/?'+encodeURIComponent(u);},
  function(u){return'https://api.allorigins.win/raw?url='+encodeURIComponent(u);}
];

function parseM3U(text){
  var chs=[],cur=null,lines=text.split('\n');
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line)continue;
    if(line.startsWith('#EXTINF:')){
      var lc=line.lastIndexOf(',');
      var dn=lc>=0?line.slice(lc+1).trim():'';
      var safe=function(re){try{var m=line.match(re);return m?m[1].trim():'';}catch(e){return'';}};
      cur={id:'',name:(safe(/tvg-name="([^"]*)"/)||dn||'Unknown').trim(),
           logo:safe(/tvg-logo="([^"]*)"/),
           group:(safe(/group-title="([^"]*)"/) ||'General').trim(),
           url:''};
    } else if(!line.startsWith('#')&&cur&&(line.startsWith('http')||line.startsWith('rtmp'))){
      cur.url=line; cur.id='ch_'+chs.length; chs.push(cur); cur=null;
    }
  }
  return chs;
}

async function fetchM3U(url){
  for(var i=0;i<PROXIES.length;i++){
    var ctrl=new AbortController(), t=setTimeout(function(){ctrl.abort();},18000);
    try{
      var r=await fetch(PROXIES[i](url),{signal:ctrl.signal,headers:{Accept:'application/x-mpegurl,*/*'}});
      clearTimeout(t);
      if(r.ok){var txt=await r.text(); if(txt.includes('#EXTINF')||txt.includes('#EXTM3U'))return txt;}
    }catch(e){clearTimeout(t);}
  }
  return null;
}

/* ── Category helpers ───────────────────────── */
var ICON_MAP=[
  [/news/,'📰'],[/movie|film/,'🎬'],[/music|song/,'🎵'],[/sport|cricket/,'🏏'],
  [/kids|cartoon/,'🧒'],[/entertain|serial/,'🎭'],[/devot|spirit/,'🙏'],
  [/comedy/,'😂'],[/telugu/,'🌟'],[/tamil/,'🎪'],[/hindi/,'🇮🇳'],[/english/,'🌐']
];
function catIcon(g){
  g=(g||'').toLowerCase();
  for(var i=0;i<ICON_MAP.length;i++)if(ICON_MAP[i][0].test(g))return ICON_MAP[i][1];
  return '📡';
}
function getCategories(chs){
  if(!chs||!chs.length)return [{name:'All',count:0,icon:'📺'}];
  var map={};
  chs.forEach(function(ch){var g=ch.group||'General';if(!map[g])map[g]={name:g,count:0,icon:catIcon(g)};map[g].count++;});
  var arr=Object.values(map).sort(function(a,b){return b.count-a.count;});
  return [{name:'All',count:chs.length,icon:'📺'}].concat(arr);
}

/* ── Channel logo ───────────────────────────── */
var GRADS=[['#1a1a1a','#2e2e2e'],['#111','#252525'],['#0d0d0d','#222'],
           ['#181818','#2c2c2c'],['#0f0f0f','#1e1e1e'],['#141414','#282828']];
function colFor(name){var h=5381;for(var i=0;i<name.length;i++)h=((h*33)^name.charCodeAt(i))>>>0;return GRADS[h%GRADS.length];}
function inits(name){var w=(name||'').trim().split(/[\s\-_|]+/).filter(Boolean);if(!w.length)return'CH';if(w.length===1)return w[0].slice(0,2).toUpperCase();return(w[0][0]+w[1][0]).toUpperCase();}

function Logo(props){
  var src=props.src,name=props.name||'',size=props.size||56,radius=props.radius||12,lazy=props.lazy;
  var errS=useState(false),err=errS[0],setErr=errS[1];
  var visS=useState(!lazy),vis=visS[0],setVis=visS[1];
  var ref=useRef(null);
  var colors=colFor(name);
  useEffect(function(){
    if(!lazy||!ref.current)return;
    var obs=new IntersectionObserver(function(es){if(es[0].isIntersecting){setVis(true);obs.disconnect();}},{rootMargin:'200px'});
    obs.observe(ref.current);
    return function(){obs.disconnect();};
  },[lazy]);
  var base={width:size,height:size,borderRadius:radius,flexShrink:0,overflow:'hidden',display:'flex',alignItems:'center',justifyContent:'center'};
  if(!src||err||!vis){
    return h('div',{ref:ref,style:Object.assign({},base,{background:'linear-gradient(145deg,'+colors[0]+','+colors[1]+')',border:'1px solid rgba(255,255,255,.06)'})},
      h('span',{style:{color:'rgba(255,255,255,.55)',fontWeight:700,fontSize:Math.round(size*.31),lineHeight:1}},inits(name)));
  }
  return h('img',{ref:ref,src:src,alt:name,onError:function(){setErr(true);},
    style:Object.assign({},base,{objectFit:'contain',background:'#111'}),loading:'lazy'});
}

/* ── AVPlay hook ────────────────────────────── */
function useAVPlay(){
  var psS=useState(PS.NONE),ps=psS[0],setPS=psS[1];
  var bufS=useState(false),buf=bufS[0],setBuf=bufS[1];
  var mutS=useState(false),muted=mutS[0],setMuted=mutS[1];
  var avRef=useRef(null);
  var isTizen=!!(window.webapis&&window.webapis.avplay);
  var BUF_MAP=[2000,5000,10000];

  useEffect(function(){
    if(isTizen)avRef.current=window.webapis.avplay;
    setPS(PS.IDLE);
    return function(){destroy();};
  },[]);

  function destroy(){
    if(isTizen&&avRef.current){try{var s=avRef.current.getState();if(s!=='NONE'&&s!=='IDLE'){avRef.current.stop();avRef.current.close();}}catch(e){}}
    else{var v=document.getElementById('avv');if(v){v.pause();v.src='';}}
  }

  function play(url,name){
    if(!url)return;
    setBuf(true);setPS(PS.LOADING);
    var cfg=LS.get(CFG_KEY,{});
    var bufMs=BUF_MAP[cfg.bufferSize||1]||5000;
    if(isTizen){
      try{
        var ap=avRef.current;
        var st=ap.getState();
        if(st!=='NONE'&&st!=='IDLE'){ap.stop();ap.close();}
        ap.open(url);
        try{ap.setBufferingParam&&ap.setBufferingParam({buffering_time:bufMs});}catch(e){}
        ap.setDisplayRect(0,0,1920,1080);
        ap.setDisplayMethod('PLAYER_DISPLAY_MODE_FULL_SCREEN');
        ap.setListener({
          onbufferingstart:function(){setBuf(true);},
          onbufferingprogress:function(){},
          onbufferingcomplete:function(){setBuf(false);},
          oncurrentplaytime:function(){},
          onEvent:function(){},
          onerror:function(e){console.error('AVPlay',e);setPS(PS.ERROR);setBuf(false);},
          ondrmevent:function(){},
          onstreamcompleted:function(){setPS(PS.IDLE);}
        });
        ap.prepare();ap.play();
        setPS(PS.PLAYING);setBuf(false);
      }catch(e){console.error('AVPlay exc',e);setPS(PS.ERROR);setBuf(false);}
    } else {
      var v2=document.getElementById('avv');
      if(!v2)return;
      v2.src=url;v2.load();
      v2.oncanplay=function(){setBuf(false);setPS(PS.PLAYING);};
      v2.onwaiting=function(){setBuf(true);};
      v2.onplaying=function(){setBuf(false);setPS(PS.PLAYING);};
      v2.onerror=function(){setPS(PS.ERROR);setBuf(false);};
      v2.muted=muted;
      v2.play().catch(function(){setPS(PS.ERROR);setBuf(false);});
    }
  }

  function togglePause(){
    if(isTizen&&avRef.current){var s=avRef.current.getState();if(s==='PLAYING'){avRef.current.pause();setPS(PS.PAUSED);}else if(s==='PAUSED'){avRef.current.play();setPS(PS.PLAYING);}}
    else{var v=document.getElementById('avv');if(v){if(v.paused){v.play();setPS(PS.PLAYING);}else{v.pause();setPS(PS.PAUSED);}}}
  }
  function stop(){destroy();setPS(PS.IDLE);setBuf(false);}
  function toggleMute(){setMuted(function(m){var n=!m;if(isTizen&&avRef.current){try{avRef.current.setMute(n);}catch(e){}}else{var v=document.getElementById('avv');if(v)v.muted=n;}return n;});}

  return {ps:ps,buf:buf,muted:muted,isTizen:isTizen,play:play,togglePause:togglePause,stop:stop,toggleMute:toggleMute};
}

/* ── Volume hook ────────────────────────────── */
function useVolume(){
  var isTizen=!!(window.webapis&&window.webapis.tvaudiocontrol);
  var getV=function(){try{return isTizen?window.webapis.tvaudiocontrol.getVolume():50;}catch(e){return 50;}};
  var vS=useState(getV),vol=vS[0],setVol=vS[1];
  var mS=useState(false),mut=mS[0],setMut=mS[1];
  var vRef=useRef(vol);

  function applyVol(v){
    var c=Math.min(100,Math.max(0,v));vRef.current=c;setVol(c);
    if(isTizen){try{window.webapis.tvaudiocontrol.setVolume(c);}catch(e){}}
    else{var vid=document.getElementById('avv');if(vid)vid.volume=c/100;}
  }
  function volUp(){applyVol(vRef.current+5);}
  function volDown(){applyVol(vRef.current-5);}
  function toggleMute(){setMut(function(m){var n=!m;if(isTizen){try{window.webapis.tvaudiocontrol.setMute(n);}catch(e){}}else{var v=document.getElementById('avv');if(v)v.muted=n;}return n;});}
  return {vol:vol,mut:mut,volUp:volUp,volDown:volDown,toggleMute:toggleMute};
}

/* ── Remote control ────────────────────────── */
var KEYS={UP:38,DOWN:40,LEFT:37,RIGHT:39,ENTER:13,BACK:10009,EXIT:10182,
  PLAY:415,PAUSE:19,PLAY_PAUSE:10252,STOP:413,FF:417,RW:412,
  N0:48,N9:57,RED:403,GREEN:404,YELLOW:405,BLUE:406,
  CHU:427,CHD:428,VU:447,VD:448,MUTE:449,INFO:457,TOOLS:10135,GUIDE:458};
var TKEYS=['MediaPlayPause','MediaPlay','MediaPause','MediaStop','MediaFastForward','MediaRewind',
  'ChannelUp','ChannelDown','VolumeUp','VolumeDown','VolumeMute',
  'ColorF0Red','ColorF1Green','ColorF2Yellow','ColorF3Blue','Exit','Tools','Guide','Info','Return'];

function regKeys(){try{if(window.tizen&&window.tizen.tvinputdevice)TKEYS.forEach(function(k){try{window.tizen.tvinputdevice.registerKey(k);}catch(e){}});}catch(e){}}

function useRemote(handlers){
  var hRef=useRef(handlers);hRef.current=handlers;
  useEffect(function(){regKeys();},[]);
  useEffect(function(){
    function onKey(e){
      var h=hRef.current,k=e.keyCode;
      if(h.onAny)h.onAny();
      if(k===KEYS.UP){e.preventDefault();if(h.onUp)h.onUp();}
      else if(k===KEYS.DOWN){e.preventDefault();if(h.onDown)h.onDown();}
      else if(k===KEYS.LEFT){e.preventDefault();if(h.onLeft)h.onLeft();}
      else if(k===KEYS.RIGHT){e.preventDefault();if(h.onRight)h.onRight();}
      else if(k===KEYS.ENTER){e.preventDefault();if(h.onOK)h.onOK();}
      else if(k===KEYS.BACK){e.preventDefault();if(h.onBack)h.onBack();}
      else if(k===KEYS.EXIT){e.preventDefault();}
      else if(k===KEYS.PLAY||k===KEYS.PLAY_PAUSE||k===KEYS.PAUSE){e.preventDefault();if(h.onPP)h.onPP();}
      else if(k===KEYS.STOP){e.preventDefault();if(h.onStop)h.onStop();}
      else if(k===KEYS.CHU){e.preventDefault();if(h.onCHU)h.onCHU();}
      else if(k===KEYS.CHD){e.preventDefault();if(h.onCHD)h.onCHD();}
      else if(k===KEYS.VU){e.preventDefault();if(h.onVU)h.onVU();}
      else if(k===KEYS.VD){e.preventDefault();if(h.onVD)h.onVD();}
      else if(k===KEYS.MUTE){e.preventDefault();if(h.onMute)h.onMute();}
      else if(k===KEYS.RED){e.preventDefault();if(h.onRed)h.onRed();}
      else if(k===KEYS.GREEN){e.preventDefault();if(h.onGreen)h.onGreen();}
      else if(k===KEYS.YELLOW){e.preventDefault();if(h.onYellow)h.onYellow();}
      else if(k===KEYS.BLUE){e.preventDefault();if(h.onBlue)h.onBlue();}
      else if(k===KEYS.TOOLS){e.preventDefault();if(h.onSettings)h.onSettings();}
      else if(k>=KEYS.N0&&k<=KEYS.N9){e.preventDefault();if(h.onDigit)h.onDigit(k-KEYS.N0);}
    }
    window.addEventListener('keydown',onKey);
    return function(){window.removeEventListener('keydown',onKey);};
  },[]);
}

/* ── Video player ───────────────────────────── */
function VideoPlayer(props){
  var ps=props.ps,buf=props.buf,muted=props.muted,ch=props.ch,isTizen=props.isTizen;
  var isLoad=ps===PS.LOADING,isPause=ps===PS.PAUSED,isIdle=ps===PS.IDLE||ps===PS.NONE,isErr=ps===PS.ERROR;
  return h('div',{style:{position:'absolute',inset:0,zIndex:0,background:'#000'}},
    isTizen
      ? h('object',{id:'avplay-player',type:'application/avplayer',style:{position:'absolute',inset:0,width:'100%',height:'100%'}})

    (isIdle&&!ch) && h('div',{style:{position:'absolute',inset:0,background:'radial-gradient(ellipse at 50% 42%,#101010 0%,#000 100%)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:24}},
      h('svg',{width:88,height:88,viewBox:'0 0 88 88',fill:'none',opacity:.12},
        h('rect',{x:6,y:20,width:76,height:48,rx:10,stroke:'white',strokeWidth:3.5}),

      ),

    ),
    (buf||isLoad) && h('div',{style:{position:'absolute',inset:0,zIndex:5,background:'rgba(0,0,0,.5)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:22}},

        h('svg',{width:36,height:36,viewBox:'0 0 24 24',fill:'rgba(255,255,255,.9)'},h('path',{d:'M8 5v14l11-7z'}))

      var z=zRef.current;
      if(z==='strip'){sCh(function(i){return Math.min(chsRef.current.length-1,i+1);});return;}
      if(z==='cats'){sCt(function(i){var n=Math.min(catsRef.current.length-1,i+1);var c=catsRef.current[n];if(c)selCat2(c.name);return n;});return;}
      if(z==='settings'){var t2=Math.min(STABS.length-1,stTabRef.current+1);sTab(t2);sItem(0);return;}
    },
    onOK:function(){
      var z=zRef.current;
      if(z==='strip'){selCh(chRef2.current);return;}
      if(z==='cats'){sz('strip');return;}
      if(z==='settings'){
        /* handled inside Settings component via direct cfg mutation */
        return;
      }
    },
    onBack:function(){
      var z=zRef.current;
      if(z==='settings'){sz('strip');return;}
      if(z==='cats'){sz('strip');return;}
      if(z==='search'){setQuery('');sz('strip');return;}
      if(editCh){setEditCh(null);return;}
    },
    onSettings:function(){zRef.current==='settings'?sz('strip'):openSettings();},
    onPP:function(){avRef3.current.togglePause();},
    onStop:function(){avRef3.current.stop();},
    onCHU:function(){sCh(function(i){var n=Math.min(chsRef.current.length-1,i+1);var ch=chsRef.current[n];if(ch){setCurIdx(n);avRef3.current.play(ch.url,ch.name);LS.set(LAST_KEY,{src:srcRef.current,id:ch.id,idx:n});}return n;});},
    onCHD:function(){sCh(function(i){var n=Math.max(0,i-1);var ch=chsRef.current[n];if(ch){setCurIdx(n);avRef3.current.play(ch.url,ch.name);LS.set(LAST_KEY,{src:srcRef.current,id:ch.id,idx:n});}return n;});},
    onVU:function(){volRef.current.volUp();showVH();},
    onVD:function(){volRef.current.volDown();showVH();},
    onMute:function(){volRef.current.toggleMute();showVH();},
    onYellow:function(){loadPl(true);},
    onRed:function(){if(visRef.current){clearTimeout(htRef.current);visRef.current=false;setOv(false);}else wake();},
    onGreen:function(){zRef.current==='search'?(setQuery(''),sz('strip')):openSearch();},
    onBlue:function(){zRef.current==='settings'?sz('strip'):openSettings();},
    onDigit:onDigit
  });

  if(loading){
    return h(AppShell,null,h(LoadingScreen,{pct:pct,status:stat,error:err,onRetry:function(){loadPl(true);}}));
  }

  var isSettings=zone==='settings',isSearch=zone==='search';
  var ovVis=ov||isSettings||isSearch;

  return h(AppShell,null,
    /* Video */
    h(VideoPlayer,{ps:av.ps,buf:av.buf,muted:av.muted,ch:curCh,isTizen:av.isTizen}),
    /* Overlay */
    h(Overlay,{visible:ovVis,ps:av.ps,muted:av.muted,ch:curCh,clock:clk,
      onSearch:openSearch,onMute:function(){av.toggleMute();showVH();},onPP:av.togglePause,onSettings:openSettings,
      chs:filtChs,curIdx:curIdx,chFocIdx:chFoc,onSelCh:selCh,
      cats:cats,selCat:selCat,onSelCat:selCat2,catFocIdx:ctFoc,
      zone:isSettings||isSearch?'strip':zone,
      favs:favs,onFav:toggleFav,
      onEdit:function(idx){var ch=chsRef.current[idx];if(ch)setEditCh(ch);}
    }),
    /* Volume HUD */
    h(VolHUD,{vol:vol.vol,mut:vol.mut,visible:vhVis}),
    /* Channel number OSD */
    dg && h(NumOSD,{digits:dg,total:filtChs.length}),
    /* Search */
    h(SearchOvr,{open:isSearch,query:query,onQ:setQuery,onClose:function(){setQuery('');sz('strip');},count:filtChs.length}),
    /* Settings */
    h(Settings,{open:isSettings,onClose:function(){sz('strip');},onRefresh:function(){sz('strip');loadPl(true);},
      tab:stTab,item:stItem,onTab:function(t){sTab(t);sItem(0);},
      cfg:cfg,setCfg:function(c){setCfg(c);LS.set(CFG_KEY,c);},
      allSrcs:allSrcs,activeSrc:activeSrc,onSrcChange:changeSrc
    }),
    /* Edit modal */
    editCh && h(EditModal,{ch:editCh,onCancel:function(){setEditCh(null);},onSave:function(data){saveOvr(editCh.id,data);setEditCh(null);}})
  );
}

/* Mount */
RD.createRoot(document.getElementById('root')).render(h(App,null));
})();
</script>
</body>
</html>
