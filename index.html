<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1920"/>
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;"/>
  <title>TV+</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,system-ui,sans-serif}
    button{font-family:inherit;cursor:pointer}
    input{font-family:inherit}
    ::-webkit-scrollbar{display:none}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.12}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .blink{animation:blink 1.4s ease-in-out infinite}
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Tizen AVPlay object (required for Samsung TV) -->
  <object id="avplay-object"
    type="application/avplayer"
    style="position:fixed;top:0;left:0;width:1920px;height:1080px;z-index:0;display:block;">
  </object>

  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    }
  </script>

  <!-- NOTE: This index.html is a shell for the Tizen TV package.
       Run `npm run build` with Vite to produce the fully inlined
       production bundle. The vite build will replace this file with
       an inlined single-file app (vite-plugin-singlefile).

       For development: npm run dev
       For production WGT: npm run build, then zip dist/ contents as .wgt
  -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
