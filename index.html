<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, initial-scale=1.0" />
  <title>JioTV · Telugu IPTV</title>
  <meta name="description" content="Premium Telugu IPTV for Samsung Smart TV — JioTV Experience" />
  <link rel="icon" href="./icon.jpg" />
  <!-- Tizen TV platform script -->
  <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
  <style>
    /* JioTV base + original functional styles */
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body, #root {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0A0718;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    /* Custom Jio scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #E20074; border-radius: 4px; }
    /* Animations */
    @keyframes jioPulse {
      0% { opacity: 0.6; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes glowPulse {
      0% { box-shadow: 0 0 0 0 rgba(226,0,116,0.4); }
      70% { box-shadow: 0 0 0 12px rgba(226,0,116,0); }
      100% { box-shadow: 0 0 0 0 rgba(226,0,116,0); }
    }
    .channel-card {
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }
    .jio-gradient-bg {
      background: radial-gradient(circle at 20% 30%, #130B2C, #060312);
    }
    .glass-panel {
      background: rgba(18, 12, 35, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226,0,116,0.25);
    }
    .jio-card {
      background: linear-gradient(145deg, #1E153F, #130C2A);
      border: 1px solid rgba(226,0,116,0.3);
    }
    .jio-card-active {
      border: 2px solid #E20074;
      transform: scale(1.02);
      box-shadow: 0 12px 32px rgba(226,0,116,0.4);
    }
    .focus-glow {
      animation: glowPulse 0.3s ease-out;
    }
    .text-glow {
      text-shadow: 0 0 8px rgba(226,0,116,0.5);
    }
    .jio-logo-gradient {
      background: linear-gradient(135deg, #FFAFE7 0%, #E20074 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    /* Ensure video fills area */
    #avplay-video, #avplay-player, .player-element {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module">
    // ***********************************************
    // FULL ORIGINAL CORE LOGIC (preserved 100%)
    // Includes: playlist fetch, caching, category builder,
    // Tizen AVPlay, remote control, search, player state
    // ***********************************************
    import React, { useState, useEffect, useCallback, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    
    // ----- Playlist sources & utilities (identical to original) -----
    const SOURCES = [
      "https://iptv-org.github.io/iptv/languages/tel.m3u",
      "https://iptv-org.github.io/iptv/countries/in.m3u"
    ];
    const CACHE_KEY = "telugu_iptv_playlist_v2";
    const CACHE_TTL = 6 * 60 * 60 * 1000;
    
    function parseM3U(content) {
      const lines = content.split(/\r?\n/);
      const channels = [];
      let current = null;
      for (let line of lines) {
        line = line.trim();
        if (!line) continue;
        if (line.startsWith("#EXTINF:")) {
          current = extractMeta(line);
        } else if (line.startsWith("http") && current) {
          current.url = line;
          current.id = `ch_${Date.now()}_${Math.random()}`;
          channels.push(current);
          current = null;
        }
      }
      return channels;
    }
    
    function extractMeta(line) {
      const nameMatch = line.match(/tvg-name="([^"]*)"/);
      const logoMatch = line.match(/tvg-logo="([^"]*)"/);
      const groupMatch = line.match(/group-title="([^"]*)"/);
      const langMatch = line.match(/tvg-language="([^"]*)"/);
      const lastComma = line.lastIndexOf(",");
      let title = lastComma >= 0 ? line.slice(lastComma + 1).trim() : "Unknown Channel";
      return {
        name: (nameMatch?.[1] || title || "Channel").trim(),
        logo: logoMatch?.[1] || "",
        group: groupMatch?.[1] || "General",
        language: langMatch?.[1] || "",
        country: "",
        url: ""
      };
    }
    
    function buildCategories(channels) {
      const map = new Map();
      map.set("All", { name: "All", count: channels.length, icon: "🔥" });
      for (let ch of channels) {
        let g = ch.group || "General";
        if (!map.has(g)) map.set(g, { name: g, count: 0, icon: getGroupIcon(g) });
        map.get(g).count++;
      }
      return Array.from(map.values()).sort((a, b) => b.count - a.count);
    }
    
    function getGroupIcon(group) {
      const g = group.toLowerCase();
      if (g.includes("news")) return "📰";
      if (g.includes("movie") || g.includes("film")) return "🎬";
      if (g.includes("sport") || g.includes("cricket")) return "🏏";
      if (g.includes("music")) return "🎵";
      if (g.includes("kids")) return "🧒";
      if (g.includes("entertain")) return "🎭";
      if (g.includes("telugu")) return "🌟";
      return "📡";
    }
    
    async function fetchPlaylistWithProxy(url) {
      const proxies = [
        u => u,
        u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
        u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`
      ];
      for (let proxy of proxies) {
        try {
          const res = await fetch(proxy(url), { signal: AbortSignal.timeout(15000) });
          if (res.ok) {
            const text = await res.text();
            if (text.includes("#EXTM3U") || text.includes("#EXTINF")) return text;
          }
        } catch (e) {}
      }
      throw new Error("All playlist sources failed");
    }
    
    function getCachedChannels() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const { channels, timestamp } = JSON.parse(raw);
        if (Date.now() - timestamp > CACHE_TTL) return null;
        return channels;
      } catch { return null; }
    }
    
    function cacheChannels(channels) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ channels, timestamp: Date.now() }));
      } catch (e) {}
    }
    
    // ----- Main custom hook (identical to original Zd) -----
    function usePlaylist() {
      const [channels, setChannels] = useState([]);
      const [loading, setLoading] = useState(true);
      const [progress, setProgress] = useState(0);
      const [status, setStatus] = useState("Loading playlist...");
      const [error, setError] = useState(null);
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [searchQuery, setSearchQuery] = useState("");
      const [currentIndex, setCurrentIndex] = useState(-1);
      
      const load = useCallback(async (force = false) => {
        setLoading(true);
        setError(null);
        if (!force) {
          const cached = getCachedChannels();
          if (cached && cached.length) {
            setChannels(cached);
            setStatus(`Loaded ${cached.length} channels from cache`);
            setProgress(100);
            setLoading(false);
            return;
          }
        }
        for (let i = 0; i < SOURCES.length; i++) {
          try {
            setStatus(`Fetching source ${i+1}...`);
            setProgress(20 + i * 30);
            const m3u = await fetchPlaylistWithProxy(SOURCES[i]);
            setStatus("Parsing channels...");
            const parsed = parseM3U(m3u);
            if (parsed.length) {
              cacheChannels(parsed);
              setChannels(parsed);
              setStatus(`Ready — ${parsed.length} channels`);
              setProgress(100);
              setLoading(false);
              return;
            }
          } catch (err) {
            console.warn(err);
          }
        }
        setError("Failed to load any playlist");
        setLoading(false);
      }, []);
      
      useEffect(() => { load(); }, []);
      
      const filtered = useMemo(() => {
        let list = selectedCategory === "All" ? channels : channels.filter(c => c.group === selectedCategory);
        if (searchQuery) list = list.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()));
        return list;
      }, [channels, selectedCategory, searchQuery]);
      
      const categories = useMemo(() => buildCategories(channels), [channels]);
      const currentChannel = currentIndex >= 0 ? filtered[currentIndex] : null;
      
      return {
        channels, filteredChannels: filtered, categories, loading, progress, status, error,
        selectedCategory, setSelectedCategory, searchQuery, setSearchQuery,
        currentChannel, currentIndex, setCurrentIndex, refreshPlaylist: () => load(true)
      };
    }
    
    // ----- Player hook (identical to original Jd, supports Tizen AVPlay & fallback) -----
    function usePlayer(containerRef) {
      const [playerState, setPlayerState] = useState("IDLE");
      const [isBuffering, setBuffering] = useState(false);
      const [isMuted, setMuted] = useState(false);
      const [errorMsg, setErrorMsg] = useState(null);
      const isTizen = typeof window !== 'undefined' && !!window.webapis?.avplay;
      const avPlayRef = useRef(null);
      
      const destroy = useCallback(() => {
        if (isTizen && window.webapis?.avplay) {
          try { window.webapis.avplay.stop?.(); window.webapis.avplay.close?.(); } catch(e) {}
        } else {
          const vid = document.getElementById("fallback-video");
          if (vid) { vid.pause(); vid.src = ""; }
        }
        setPlayerState("IDLE");
        setBuffering(false);
      }, [isTizen]);
      
      const play = useCallback(async (channel) => {
        if (!channel?.url) return;
        destroy();
        setErrorMsg(null);
        setPlayerState("LOADING");
        setBuffering(true);
        if (isTizen) {
          try {
            const av = window.webapis.avplay;
            av.open(channel.url);
            const rect = containerRef.current?.getBoundingClientRect();
            av.setDisplayRect(0, 0, rect?.width || 1100, rect?.height || 619);
            av.setDisplayMethod?.("PLAYER_DISPLAY_MODE_LETTER_BOX");
            av.setListener({
              onbufferingstart: () => setBuffering(true),
              onbufferingcomplete: () => setBuffering(false),
              oncurrentplaytime: () => {},
              onerror: (e) => { setErrorMsg("Playback error"); setPlayerState("ERROR"); setBuffering(false); },
              onstreamcompleted: () => { setPlayerState("IDLE"); }
            });
            av.prepare();
            av.play();
            setPlayerState("PLAYING");
            setBuffering(false);
          } catch (err) {
            setErrorMsg(err.message);
            setPlayerState("ERROR");
            setBuffering(false);
          }
        } else {
          const video = document.getElementById("fallback-video");
          if (!video) return;
          video.src = channel.url;
          video.load();
          video.oncanplay = () => { setBuffering(false); setPlayerState("PLAYING"); };
          video.onerror = () => { setErrorMsg("Stream unavailable"); setPlayerState("ERROR"); setBuffering(false); };
          video.onwaiting = () => setBuffering(true);
          video.onplaying = () => { setBuffering(false); setPlayerState("PLAYING"); };
          video.play().catch(() => { setErrorMsg("Cannot play"); setPlayerState("ERROR"); });
        }
      }, [isTizen, destroy, containerRef]);
      
      const togglePause = useCallback(() => {
        if (isTizen && window.webapis.avplay) {
          const state = window.webapis.avplay.getState?.();
          if (state === "PLAYING") { window.webapis.avplay.pause(); setPlayerState("PAUSED"); }
          else if (state === "PAUSED") { window.webapis.avplay.play(); setPlayerState("PLAYING"); }
        } else {
          const vid = document.getElementById("fallback-video");
          if (!vid) return;
          if (vid.paused) { vid.play(); setPlayerState("PLAYING"); }
          else { vid.pause(); setPlayerState("PAUSED"); }
        }
      }, [isTizen]);
      
      const toggleMute = useCallback(() => {
        if (isTizen && window.webapis.avplay) {
          window.webapis.avplay.setMute(!isMuted);
        } else {
          const vid = document.getElementById("fallback-video");
          if (vid) vid.muted = !isMuted;
        }
        setMuted(prev => !prev);
      }, [isTizen, isMuted]);
      
      useEffect(() => {
        return () => destroy();
      }, [destroy]);
      
      return { playerState, isBuffering, isMuted, errorMsg, isTizen, play, togglePause, destroy, toggleMute };
    }
    
    // ----- Remote control handler (same as bd) -----
    function useRemoteNavigation(handlers, enabled = true) {
      useEffect(() => {
        if (!enabled) return;
        const onKey = (e) => {
          const key = e.keyCode;
          const mapping = {
            38: 'onUp', 40: 'onDown', 37: 'onLeft', 39: 'onRight',
            13: 'onEnter', 10009: 'onBack', 27: 'onBack', 10182: 'onExit',
            415: 'onPlayPause', 19: 'onPlayPause', 10252: 'onPlayPause',
            413: 'onStop', 427: 'onChannelUp', 428: 'onChannelDown',
            77: 'onMute', 403: 'onRed', 404: 'onGreen', 405: 'onYellow', 406: 'onBlue'
          };
          const handler = mapping[key];
          if (handler && handlers[handler]) {
            e.preventDefault();
            handlers[handler]();
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [handlers, enabled]);
    }
    
    // ************************************************
    // JioTV UPGRADED UI COMPONENT (preserves all logic)
    // ************************************************
    function JioTVApp() {
      const {
        filteredChannels, categories, loading, progress, status, error,
        selectedCategory, setSelectedCategory, searchQuery, setSearchQuery,
        currentChannel, currentIndex, setCurrentIndex, refreshPlaylist
      } = usePlaylist();
      
      const playerContainer = useRef(null);
      const { playerState, isBuffering, isMuted, errorMsg, isTizen, play, togglePause, destroy, toggleMute } = usePlayer(playerContainer);
      const [focusZone, setFocusZone] = useState("strip"); // strip, category, player
      const [focusedStripIndex, setFocusedStripIndex] = useState(0);
      
      // Auto-play when channel changes
      useEffect(() => {
        if (currentChannel) play(currentChannel);
      }, [currentChannel, play]);
      
      // sync focus index with current channel index
      useEffect(() => {
        if (currentIndex >= 0 && focusZone === "strip") setFocusedStripIndex(currentIndex);
      }, [currentIndex, focusZone]);
      
      // Remote navigation (JioTV style)
      useRemoteNavigation({
        onUp: () => {
          if (focusZone === "strip") setFocusZone("category");
          else if (focusZone === "player") setFocusZone("strip");
        },
        onDown: () => {
          if (focusZone === "category") setFocusZone("strip");
          else if (focusZone === "strip") setFocusZone("player");
        },
        onLeft: () => {
          if (focusZone === "strip") setFocusedStripIndex(prev => Math.max(0, prev - 1));
          else if (focusZone === "category") {
            const idx = categories.findIndex(c => c.name === selectedCategory);
            if (idx > 0) setSelectedCategory(categories[idx-1].name);
          }
        },
        onRight: () => {
          if (focusZone === "strip") setFocusedStripIndex(prev => Math.min(filteredChannels.length - 1, prev + 1));
          else if (focusZone === "category") {
            const idx = categories.findIndex(c => c.name === selectedCategory);
            if (idx < categories.length-1) setSelectedCategory(categories[idx+1].name);
          }
        },
        onEnter: () => {
          if (focusZone === "strip") setCurrentIndex(focusedStripIndex);
          else if (focusZone === "player") togglePause();
        },
        onBack: () => {
          if (focusZone !== "strip") setFocusZone("strip");
          else destroy();
        },
        onPlayPause: () => togglePause(),
        onStop: () => destroy(),
        onChannelUp: () => setCurrentIndex(prev => Math.min(filteredChannels.length-1, prev+1)),
        onChannelDown: () => setCurrentIndex(prev => Math.max(-1, prev-1)),
        onMute: () => toggleMute(),
        onYellow: () => refreshPlaylist()
      }, !loading);
      
      // Render loading screen
      if (loading) {
        return (
          <div className="relative w-full h-full jio-gradient-bg flex flex-col items-center justify-center">
            <div className="w-24 h-24 rounded-full border-4 border-pink-500 border-t-transparent animate-spin"></div>
            <p className="text-text-primary text-xl mt-6 font-medium">{status}</p>
            <div className="w-80 h-1.5 bg-white/10 rounded-full mt-4 overflow-hidden"><div className="h-full bg-gradient-to-r from-pink-500 to-rose-500" style={{ width: `${progress}%` }}></div></div>
          </div>
        );
      }
      
      return (
        <div className="relative w-full h-full overflow-hidden jio-gradient-bg" style={{ width: 1920, height: 1080 }}>
          {/* animated background pattern */}
          <div className="absolute inset-0 opacity-10 pointer-events-none" style={{ backgroundImage: "radial-gradient(circle at 20% 40%, #E20074 1px, transparent 1px)", backgroundSize: "48px 48px" }}></div>
          
          {/* JioTV Header */}
          <div className="absolute top-0 left-0 right-0 z-30 px-8 py-4 flex justify-between items-center" style={{ background: "linear-gradient(180deg, rgba(6,3,18,0.96) 0%, rgba(6,3,18,0.7) 100%)", backdropFilter: "blur(12px)" }}>
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-pink-500 to-rose-600 flex items-center justify-center shadow-lg shadow-pink-500/30"><span className="text-2xl font-black text-white">JIO</span></div>
              <div><h1 className="text-2xl font-extrabold jio-logo-gradient tracking-wide">JioTV</h1><p className="text-text-dim text-xs -mt-1">Telugu · Live & Free</p></div>
            </div>
            <div className="glass-panel rounded-full px-5 py-2 flex items-center gap-4">
              <span className="text-sm text-text-sub">📺 {filteredChannels.length} channels</span>
              <div className="w-px h-5 bg-white/20"></div>
              <div className="text-text-primary text-sm font-mono">{new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}</div>
            </div>
          </div>
          
          {/* Main layout */}
          <div className="flex h-full pt-24 pb-6">
            {/* Sidebar Categories (Jio style) */}
            <div className={`w-64 z-20 transition-all duration-200 ${focusZone === "category" ? "ring-2 ring-pink-500 ring-offset-2 ring-offset-transparent" : ""}`} style={{ background: "rgba(8,4,22,0.7)", backdropFilter: "blur(16px)", borderRight: "1px solid rgba(226,0,116,0.3)" }}>
              <div className="px-5 py-4 text-sm font-semibold text-pink-400 tracking-wider flex items-center gap-2"><span>🎯</span> EXPLORE</div>
              <div className="overflow-y-auto h-[calc(100%-60px)]">
                {categories.map(cat => (
                  <button key={cat.name} onClick={() => { setSelectedCategory(cat.name); setFocusZone("category"); }} className={`w-full flex items-center gap-3 px-5 py-3 transition-all ${selectedCategory === cat.name ? "bg-gradient-to-r from-pink-600/30 to-transparent border-l-4 border-pink-500" : "hover:bg-white/5"} text-left`}>
                    <span className="text-xl">{cat.icon}</span><span className={`text-sm font-medium ${selectedCategory === cat.name ? "text-pink-300" : "text-text-sub"}`}>{cat.name}</span><span className="ml-auto text-xs text-pink-400/60">{cat.count}</span>
                  </button>
                ))}
              </div>
            </div>
            
            {/* Right side: player + channel strip */}
            <div className="flex-1 flex flex-col px-6">
              {/* Search bar */}
              <div className="mb-4 flex justify-end">
                <div className="glass-panel rounded-full px-4 py-2 w-72 flex items-center gap-2">
                  <span className="text-pink-400">🔍</span>
                  <input type="text" placeholder="Search channels..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="bg-transparent border-none outline-none text-sm w-full text-white placeholder:text-text-dim" />
                  {searchQuery && <button onClick={() => setSearchQuery("")} className="text-text-dim hover:text-white">✕</button>}
                </div>
              </div>
              
              {/* Player area with focus ring */}
              <div ref={playerContainer} className={`relative rounded-3xl overflow-hidden bg-black/50 backdrop-blur-sm transition-all duration-200 ${focusZone === "player" ? "ring-4 ring-pink-500/80" : ""}`} style={{ aspectRatio: "16/9", maxWidth: 1100, margin: "0 auto", width: "100%" }}>
                {!isTizen && <video id="fallback-video" className="w-full h-full object-contain" autoPlay playsInline muted={isMuted}></video>}
                {isTizen && <object id="avplay-player" type="application/avplayer" className="w-full h-full"></object>}
                {(playerState === "LOADING" || isBuffering) && (
                  <div className="absolute inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm">
                    <div className="w-14 h-14 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
                    <p className="text-white ml-3">Buffering...</p>
                  </div>
                )}
                {playerState === "PAUSED" && currentChannel && (
                  <div className="absolute inset-0 flex items-center justify-center bg-black/40">
                    <div className="bg-black/70 rounded-full p-4"><svg className="w-12 h-12 text-pink-500" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                  </div>
                )}
                {(errorMsg || (playerState === "ERROR")) && (
                  <div className="absolute inset-0 flex flex-col items-center justify-center bg-black/70">
                    <span className="text-5xl mb-3">⚠️</span>
                    <p className="text-red-400 text-lg">{errorMsg || "Stream error"}</p>
                    <button onClick={() => currentChannel && play(currentChannel)} className="mt-4 glass-panel px-4 py-2 rounded-full text-pink-300">Retry</button>
                  </div>
                )}
                {currentChannel && playerState === "PLAYING" && (
                  <div className="absolute bottom-3 left-3 glass-panel rounded-full px-3 py-1 text-xs flex items-center gap-2 animate-fadeIn">
                    <span className="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                    <span className="text-text-primary font-medium">{currentChannel.name}</span>
                  </div>
                )}
                {!currentChannel && (
                  <div className="absolute inset-0 flex flex-col items-center justify-center">
                    <span className="text-6xl mb-4">📡</span>
                    <p className="text-text-sub text-lg">Select a channel to start watching JioTV</p>
                  </div>
                )}
              </div>
              
              {/* Horizontal channel strip (Jio carousel) */}
              <div className={`mt-5 rounded-2xl p-2 transition-all ${focusZone === "strip" ? "bg-pink-500/10 ring-1 ring-pink-500" : ""}`}>
                <div className="flex gap-4 overflow-x-auto pb-3 px-1 scrollbar-thin" style={{ scrollbarWidth: "thin" }}>
                  {filteredChannels.map((ch, idx) => (
                    <button key={ch.id} onClick={() => { setCurrentIndex(idx); setFocusZone("strip"); }} className={`channel-card flex-shrink-0 w-44 rounded-xl p-2 flex flex-col items-center gap-2 transition-all ${currentIndex === idx ? "jio-card-active bg-gradient-to-b from-pink-900/40 to-purple-900/40" : "jio-card"} ${focusedStripIndex === idx && focusZone === "strip" ? "scale-105 border-pink-400 shadow-lg shadow-pink-500/30" : ""}`} style={{ width: 160 }}>
                      <div className="w-20 h-20 rounded-xl bg-white/5 flex items-center justify-center overflow-hidden">
                        {ch.logo ? <img src={ch.logo} className="w-full h-full object-contain" onError={(e)=>e.target.style.display='none'} alt={ch.name} /> : <span className="text-3xl">📺</span>}
                      </div>
                      <span className="text-sm font-medium text-center truncate w-full text-text-primary">{ch.name}</span>
                      <span className="text-[10px] text-pink-300/70">{ch.group}</span>
                    </button>
                  ))}
                  <div className="flex-shrink-0 w-4"></div>
                </div>
              </div>
            </div>
          </div>
          
          {/* error toaster */}
          {error && (
            <div className="absolute bottom-8 left-1/2 transform -translate-x-1/2 glass-panel px-5 py-2 rounded-full text-red-300 flex gap-3 z-40">
              <span>⚠️ {error}</span>
              <button onClick={refreshPlaylist} className="underline text-pink-400">Retry</button>
            </div>
          )}
          <style>{`
            @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
            .animate-fadeIn { animation: fadeIn 0.2s ease-out; }
            .animate-spin { animation: spin 0.8s linear infinite; }
            @keyframes spin { to { transform: rotate(360deg); } }
          `}</style>
        </div>
      );
    }
    
    // Mount the JioTV upgraded app
    const container = document.getElementById("root");
    const root = createRoot(container);
    root.render(React.createElement(React.StrictMode, null, React.createElement(JioTVApp, null)));
  </script>
</body>
</html>
