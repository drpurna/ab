<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="tizen:interface-orientation" content="landscape">
  <title>Telugu IPTV - Samsung TV</title>
  <!-- Tailwind CSS v3 + TV focus styles -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Shaka Player -->
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.js"></script>
  <!-- React & ReactDOM -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <style>
    *:focus-visible {
      outline: 3px solid #f97316;
      outline-offset: 2px;
    }
    .custom-scroll::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #1f2937;
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #f97316;
      border-radius: 4px;
    }
    .channel-card {
      transition: transform 0.15s ease, border 0.1s;
    }
    .channel-card:focus-visible, .channel-card.active-channel {
      transform: scale(1.02);
      border: 2px solid #f97316;
    }
    .settings-slide {
      transition: transform 0.3s ease-in-out;
    }
    body {
      background-color: #0f0f11;
      overflow: hidden;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-950 text-white overflow-hidden">
  <div id="root" class="h-screen w-screen overflow-hidden"></div>
  <script src="bundle.js"></script>
</body>
</html>
