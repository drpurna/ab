    // ==================== FIXES AND ENHANCEMENTS ====================
    (function() {
      // 1. IndexedDB caching (replaces localStorage for playlists)
      const DB_NAME = 'TeluguIPTV';
      const DB_STORE = 'playlists';
      const DB_VERSION = 1;
      let dbPromise = null;
      function openDB() {
        if (!dbPromise) {
          dbPromise = new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => resolve(request.result);
            request.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(DB_STORE)) {
                db.createObjectStore(DB_STORE, { keyPath: 'id' });
              }
            };
          });
        }
        return dbPromise;
      }
      window.savePlaylistToIDB = async function(sourceId, channels, ttlMs) {
        try {
          const db = await openDB();
          const tx = db.transaction(DB_STORE, 'readwrite');
          const store = tx.objectStore(DB_STORE);
          store.put({ id: sourceId, channels, timestamp: Date.now(), ttlMs });
          await tx.complete;
          return true;
        } catch (e) {
          console.warn('IDB save failed, fallback to localStorage', e);
          localStorage.setItem(`tiptv_cache_v3_${sourceId}`, JSON.stringify({ channels, timestamp: Date.now(), ttlMs }));
          return false;
        }
      };
      window.loadPlaylistFromIDB = async function(sourceId) {
        try {
          const db = await openDB();
          const tx = db.transaction(DB_STORE, 'readonly');
          const store = tx.objectStore(DB_STORE);
          const record = await new Promise((resolve) => {
            const req = store.get(sourceId);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          });
          if (record && Date.now() - record.timestamp < record.ttlMs) return record.channels;
          return null;
        } catch (e) {
          console.warn('IDB load failed, fallback to localStorage', e);
          const fallback = localStorage.getItem(`tiptv_cache_v3_${sourceId}`);
          if (fallback) {
            const parsed = JSON.parse(fallback);
            if (Date.now() - parsed.timestamp < parsed.ttlMs) return parsed.channels;
          }
          return null;
        }
      };

      // 2. Web Worker integration for M3U parsing
      let activeWorker = null;
      window.parseWithWorker = function(text, id, onProgress, onResult, onError) {
        if (activeWorker) activeWorker.terminate();
        activeWorker = new Worker('./m3u-worker.js');
        activeWorker.onmessage = (e) => {
          const { type, id: msgId, channels, pct, status, message } = e.data;
          if (type === 'PROGRESS' && msgId === id) onProgress(pct, status);
          else if (type === 'RESULT' && msgId === id) { onResult(channels); activeWorker = null; }
          else if (type === 'ERROR' && msgId === id) { onError(message); activeWorker = null; }
        };
        activeWorker.postMessage({ type: 'PARSE', id, text });
      };
      window.fetchAndParseWithWorker = function(url, id, onProgress, onResult, onError) {
        if (activeWorker) activeWorker.terminate();
        activeWorker = new Worker('./m3u-worker.js');
        activeWorker.onmessage = (e) => {
          const { type, id: msgId, channels, pct, status, message } = e.data;
          if (type === 'PROGRESS' && msgId === id) onProgress(pct, status);
          else if (type === 'RESULT' && msgId === id) { onResult(channels); activeWorker = null; }
          else if (type === 'ERROR' && msgId === id) { onError(message); activeWorker = null; }
        };
        activeWorker.postMessage({ type: 'FETCH_AND_PARSE', url, id });
      };

      // 3. Custom URL source
      const originalSources = [
        { id: 'tel', label: 'Telugu Only', desc: 'Telugu language channels (~200)', url: 'https://iptv-org.github.io/iptv/languages/tel.m3u' },
        { id: 'india', label: 'India — All', desc: 'All Indian channels (~800)', url: 'https://iptv-org.github.io/iptv/countries/in.m3u' },
        { id: 'sports', label: 'Sports', desc: 'Sports channels worldwide', url: 'https://iptv-org.github.io/iptv/categories/sports.m3u' },
        { id: 'news', label: 'News', desc: 'News channels worldwide', url: 'https://iptv-org.github.io/iptv/categories/news.m3u' },
        { id: 'entertainment', label: 'Entertainment', desc: 'Entertainment channels worldwide', url: 'https://iptv-org.github.io/iptv/categories/entertainment.m3u' }
      ];
      const CUSTOM_SOURCE = { id: 'custom', label: 'Custom URL', desc: 'Enter your own M3U link', url: '' };
      window.mt = [...originalSources, CUSTOM_SOURCE];

      // 4. Resume playback & last category
      window.LAST_CHANNEL_KEY = 'tiptv_last_channel';
      window.LAST_CATEGORY_KEY = 'tiptv_last_category';

      // 5. Volume overlay debounce
      let volumeTimer = null;
      window.showVolumeOverlay = function(setVisible) {
        if (volumeTimer) clearTimeout(volumeTimer);
        setVisible(true);
        volumeTimer = setTimeout(() => setVisible(false), 2000);
      };

      // 6. Numeric jump buffer
      let digitBuffer = '';
      let digitTimeout = null;
      window.handleDigit = function(digit, filteredChannels, setCurrentChannelIndex) {
        if (digitTimeout) clearTimeout(digitTimeout);
        digitBuffer += digit;
        digitTimeout = setTimeout(() => { digitBuffer = ''; }, 1500);
        const idx = parseInt(digitBuffer) - 1;
        if (idx >= 0 && idx < filteredChannels.length) {
          setCurrentChannelIndex(idx);
          digitBuffer = '';
          if (digitTimeout) clearTimeout(digitTimeout);
        }
      };

      // 7. Auto-retry for stream errors (integrated into player hook)
      // The original player hook (Wp) will be extended with retry logic.
      const originalWp = window.Wp;
      if (originalWp) {
        window.Wp = function() {
          const player = originalWp();
          const originalPlayChannel = player.playChannel;
          player.playChannel = async (url, name, retries = 2) => {
            for (let i = 0; i <= retries; i++) {
              try {
                await originalPlayChannel(url, name);
                return;
              } catch (e) {
                if (i === retries) throw e;
                await new Promise(r => setTimeout(r, 1000 * (i+1)));
              }
            }
          };
          return player;
        };
      }

      // 8. Apply settings (aspect ratio, showBug, hintBar) from config
      window.applySettings = function(config) {
        const overlay = document.querySelector('.channel-overlay');
        if (overlay) overlay.style.display = config.showBug !== false ? 'flex' : 'none';
        const hintBar = document.querySelector('.hint-bar');
        if (hintBar) hintBar.style.display = config.hintBar !== false ? 'flex' : 'none';
        const video = document.getElementById('avplay-video');
        if (video) {
          const ratio = config.aspectRatio || 0;
          if (ratio === 1) video.style.objectFit = 'contain';
          else if (ratio === 2) video.style.objectFit = 'contain';
          else if (ratio === 3) video.style.objectFit = 'cover';
          else video.style.objectFit = 'contain';
        }
      };

      // 9. Send CACHE_M3U to service worker after fetching playlist
      window.cacheM3uToSW = function(url, content) {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'CACHE_M3U', url, text: content });
        }
      };
    })();
