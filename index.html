<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Telugu IPTV - Samsung TV</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Shaka Player -->
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.js"></script>
  <!-- React & ReactDOM -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <style>
    *:focus-visible {
      outline: 2px solid #f97316;
      outline-offset: 2px;
    }
    .custom-scroll::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #1f2937;
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #f97316;
      border-radius: 4px;
    }
    .channel-card.active {
      border: 2px solid #f97316;
      transform: scale(1.02);
    }
    body {
      background: #0a0a0f;
      overflow: hidden;
      margin: 0;
    }
    #root {
      height: 100vh;
      width: 100vw;
    }
    /* Error message style */
    .error-overlay {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: #ff6666;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 8px;
      z-index: 9999;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Global error catcher
    window.onerror = function(msg, url, line, col, error) {
      var errorDiv = document.createElement('div');
      errorDiv.className = 'error-overlay';
      errorDiv.innerHTML = 'Error: ' + (error ? error.message : msg);
      document.body.appendChild(errorDiv);
      console.error(error);
      return false;
    };
    
    // Check if React loaded
    if (typeof React === 'undefined') {
      document.getElementById('root').innerHTML = '<div style="color:white; padding:20px;">React failed to load. Check internet connection.</div>';
    } else {
      // Main app code
      (function() {
        const { useState, useEffect, useRef } = React;
        
        // ---------- M3U Parser ----------
        function parseM3U(content) {
          const lines = content.split(/\r?\n/);
          const channels = [];
          let current = null;
          for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line.startsWith('#EXTINF')) {
              const logoMatch = line.match(/tvg-logo="([^"]*)"/);
              const groupMatch = line.match(/group-title="([^"]*)"/);
              const nameMatch = line.match(/#EXTINF:[^,]*,?(.*)$/);
              const name = nameMatch ? nameMatch[1].trim() : 'Unknown';
              const logo = logoMatch ? logoMatch[1] : null;
              const group = groupMatch ? groupMatch[1] : 'General';
              current = { name, logo, group, url: null };
            } else if (line && !line.startsWith('#') && current) {
              current.url = line;
              if (current.url.startsWith('http')) channels.push({ ...current });
              current = null;
            }
          }
          return channels;
        }
        
        const FALLBACK = [
          { name: "ETV Telugu", logo: "https://i.imgur.com/SYjFh2k.png", group: "Entertainment", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
          { name: "Gemini TV", logo: "https://i.imgur.com/6Z1l2XO.png", group: "Entertainment", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
          { name: "TV9 Telugu", logo: "https://i.imgur.com/PcXWy9R.png", group: "News", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }
        ];
        
        const App = () => {
          const [channels, setChannels] = useState([]);
          const [categories, setCategories] = useState(['All']);
          const [selectedCategory, setSelectedCategory] = useState('All');
          const [activeChannel, setActiveChannel] = useState(null);
          const [loading, setLoading] = useState(true);
          const [settingsOpen, setSettingsOpen] = useState(false);
          const [useNative, setUseNative] = useState(false);
          const videoRef = useRef(null);
          const shakaRef = useRef(null);
          
          // Fetch playlist
          useEffect(() => {
            const fetchPlaylist = async () => {
              try {
                const res = await fetch('https://raw.githubusercontent.com/iptv-org/iptv/master/playlists/telugu.m3u');
                if (!res.ok) throw new Error();
                const text = await res.text();
                let parsed = parseM3U(text).filter(ch => ch.url && ch.url.startsWith('http'));
                if (parsed.length === 0) throw new Error();
                setChannels(parsed);
                const cats = ['All', ...new Set(parsed.map(ch => ch.group).filter(Boolean))];
                setCategories(cats);
                setActiveChannel(parsed[0]);
              } catch (err) {
                console.warn('Fallback used');
                setChannels(FALLBACK);
                setCategories(['All', 'Entertainment', 'News']);
                setActiveChannel(FALLBACK[0]);
              } finally {
                setLoading(false);
              }
            };
            fetchPlaylist();
          }, []);
          
          const filtered = selectedCategory === 'All' ? channels : channels.filter(ch => ch.group === selectedCategory);
          
          // Shaka or native
          useEffect(() => {
            if (!activeChannel || !videoRef.current) return;
            const video = videoRef.current;
            let player = null;
            const init = async () => {
              try {
                if (shakaRef.current) shakaRef.current.destroy();
                player = new shaka.Player(video);
                shakaRef.current = player;
                await player.load(activeChannel.url);
                setUseNative(false);
                video.play().catch(e => console.log);
              } catch (err) {
                console.warn('Shaka failed, using native', err);
                setUseNative(true);
              }
            };
            if (!useNative) init();
          }, [activeChannel, useNative]);
          
          useEffect(() => {
            if (useNative && activeChannel && videoRef.current) {
              videoRef.current.src = activeChannel.url;
              videoRef.current.load();
              videoRef.current.play().catch(e => console.log);
            }
          }, [useNative, activeChannel]);
          
          if (loading) {
            return (
              <div className="flex items-center justify-center h-full w-full bg-black text-white">
                <div className="text-center">
                  <div className="animate-spin rounded-full h-16 w-16 border-t-4 border-orange-500 mx-auto mb-4"></div>
                  <p>Loading Telugu channels...</p>
                </div>
              </div>
            );
          }
          
          return (
            <div className="relative h-full w-full flex flex-col bg-gradient-to-b from-gray-900 to-black">
              {/* Header */}
              <div className="flex justify-between items-center px-6 py-3 bg-black/40 backdrop-blur-sm">
                <div className="flex items-center gap-3">
                  <span className="text-3xl">📺</span>
                  <h1 className="text-xl font-bold text-orange-400">Telugu IPTV</h1>
                  <span className="text-xs bg-gray-800 px-2 py-1 rounded-full">Tizen 9</span>
                </div>
                <button onClick={() => setSettingsOpen(true)} className="bg-gray-800 p-2 rounded-full hover:bg-gray-700">⚙️</button>
              </div>
              
              {/* Main content */}
              <div className="flex flex-1 min-h-0 overflow-hidden px-4 gap-4 mt-2">
                {/* Left categories */}
                <div className="w-64 flex-shrink-0 bg-gray-900/60 rounded-2xl p-3 overflow-y-auto custom-scroll">
                  <h2 className="text-lg font-semibold mb-3 text-orange-300 border-l-4 border-orange-500 pl-2">Categories</h2>
                  <div className="space-y-2">
                    {categories.map(cat => (
                      <button key={cat} onClick={() => setSelectedCategory(cat)} className={`w-full text-left px-3 py-2 rounded-xl transition ${selectedCategory === cat ? 'bg-orange-600' : 'bg-gray-800/70 hover:bg-gray-700'}`}>
                        {cat}
                      </button>
                    ))}
                  </div>
                  <div className="mt-6 text-xs text-gray-400 text-center">{channels.length} channels</div>
                </div>
                
                {/* Player shifted right */}
                <div className="flex-1 flex justify-end items-start">
                  <div className="w-[75%] max-w-4xl bg-black rounded-xl shadow-2xl border border-gray-700 overflow-hidden">
                    <div className="relative pt-[56.25%] bg-black">
                      <video ref={videoRef} className="absolute top-0 left-0 w-full h-full object-contain" autoPlay playsInline />
                      <div className="absolute bottom-2 left-3 bg-black/60 text-xs px-2 py-1 rounded">{activeChannel?.name}</div>
                    </div>
                  </div>
                </div>
              </div>
              
              {/* Bottom channel row */}
              <div className="w-full px-4 pb-6 pt-2">
                <div className="overflow-x-auto custom-scroll">
                  <div className="flex gap-3 pb-2">
                    {filtered.map((ch, idx) => (
                      <button key={idx} onClick={() => setActiveChannel(ch)} className={`flex-shrink-0 w-32 bg-gray-800/80 rounded-xl p-2 flex flex-col items-center ${activeChannel?.url === ch.url ? 'channel-card active' : ''}`}>
                        <div className="w-12 h-12 bg-gray-700 rounded-full flex items-center justify-center mb-1 overflow-hidden">
                          {ch.logo ? <img src={ch.logo} className="w-full h-full object-contain" onError={e => e.target.style.display='none'} alt="" /> : <span className="text-2xl">📡</span>}
                        </div>
                        <span className="text-xs truncate w-full">{ch.name}</span>
                        <span className="text-[10px] text-gray-400">{ch.group}</span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
              
              {/* Settings panel */}
              <div className={`fixed inset-y-0 right-0 w-80 bg-gray-900 shadow-2xl transform transition-transform duration-300 z-50 ${settingsOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                <div className="p-4">
                  <div className="flex justify-between items-center mb-4"><h2 className="text-orange-400 text-xl">Settings</h2><button onClick={() => setSettingsOpen(false)} className="text-white text-2xl">×</button></div>
                  <div className="space-y-2 text-sm">
                    <p>Player: {useNative ? 'Native (Fallback)' : 'Shaka'}</p>
                    <p>Playlist: GitHub IPTV - Telugu</p>
                  </div>
                </div>
              </div>
              {settingsOpen && <div className="fixed inset-0 bg-black/30 z-40" onClick={() => setSettingsOpen(false)}></div>}
            </div>
          );
        };
        
        // Render
        const root = document.getElementById('root');
        if (root) {
          ReactDOM.render(React.createElement(App), root);
        } else {
          document.body.innerHTML = '<div style="color:white;">Root element missing</div>';
        }
      })();
    }
  </script>
</body>
</html>
