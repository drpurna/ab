<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Test – Favorites, Last Channel, Number Entry</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body { margin: 0; background: #000; color: white; font-family: system-ui; overflow: hidden; }
    #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
    /* channel strip */
    .strip { position: relative; margin-top: auto; padding: 20px; overflow-x: auto; white-space: nowrap; background: linear-gradient(0deg, #000, transparent); }
    .card { display: inline-flex; flex-direction: column; align-items: center; width: 160px; margin: 0 8px; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 16px; position: relative; cursor: pointer; }
    .card.active { background: rgba(255,255,255,0.3); border: 2px solid white; }
    .star { position: absolute; top: 8px; right: 12px; font-size: 22px; background: none; border: none; color: rgba(255,255,255,0.6); cursor: pointer; }
    .star.fav { color: gold; }
    .logo { width: 80px; height: 80px; margin: 8px 0; background: #333; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
    .name { font-weight: bold; margin-top: 8px; text-align: center; }
    /* OSD for number entry */
    .number-osd { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 24px 48px; border-radius: 32px; font-size: 64px; font-weight: bold; z-index: 1000; }
  </style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">

// ----- Mock playlist (replace with real URL if needed) -----
const sampleChannels = [
  { id: '1', name: 'Channel One', logo: '', group: 'General' },
  { id: '2', name: 'Channel Two', logo: '', group: 'General' },
  { id: '3', name: 'Sports 1', logo: '', group: 'Sports' },
  { id: '4', name: 'News 24', logo: '', group: 'News' },
  { id: '5', name: 'Music TV', logo: '', group: 'Music' },
  { id: '6', name: 'Kids World', logo: '', group: 'Kids' },
  { id: '7', name: 'Telugu Cinema', logo: '', group: 'Telugu' },
  { id: '8', name: 'Bollywood HD', logo: '', group: 'Hindi' },
  { id: '9', name: 'Discovery', logo: '', group: 'Science' },
  { id: '10', name: 'History', logo: '', group: 'Education' }
];

function App() {
  const [channels, setChannels] = React.useState(sampleChannels);
  const [currentIndex, setCurrentIndex] = React.useState(-1);
  const [favorites, setFavorites] = React.useState(() => {
    const saved = localStorage.getItem('test_favorites');
    return saved ? JSON.parse(saved) : [];
  });
  const [digitBuffer, setDigitBuffer] = React.useState('');
  const digitTimeout = React.useRef(null);

  // Save favorites to localStorage
  React.useEffect(() => {
    localStorage.setItem('test_favorites', JSON.stringify(favorites));
  }, [favorites]);

  // Restore last channel
  React.useEffect(() => {
    const last = localStorage.getItem('test_last_channel');
    if (last !== null) {
      const idx = parseInt(last, 10);
      if (!isNaN(idx) && idx >= 0 && idx < channels.length) {
        setCurrentIndex(idx);
      }
    }
  }, [channels]);

  // Save last channel when playing a channel
  const playChannel = (idx) => {
    setCurrentIndex(idx);
    localStorage.setItem('test_last_channel', idx);
    // In a real app you would call AVPlay or video element here
    alert(`Playing: ${channels[idx].name}`);
  };

  // Toggle favorite
  const toggleFavorite = (channelId, e) => {
    e.stopPropagation();
    setFavorites(prev =>
      prev.includes(channelId) ? prev.filter(id => id !== channelId) : [...prev, channelId]
    );
  };

  // Number entry handler
  const handleDigit = (digit) => {
    if (digitTimeout.current) clearTimeout(digitTimeout.current);
    const newDigits = digitBuffer + digit;
    setDigitBuffer(newDigits);
    digitTimeout.current = setTimeout(() => {
      const targetNum = parseInt(newDigits, 10);
      if (!isNaN(targetNum) && targetNum >= 1 && targetNum <= channels.length) {
        playChannel(targetNum - 1);
      }
      setDigitBuffer('');
    }, 2000);
  };

  // Keyboard / remote key listener
  React.useEffect(() => {
    const onKey = (e) => {
      const key = e.key;
      if (key >= '0' && key <= '9') {
        e.preventDefault();
        handleDigit(parseInt(key, 10));
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [digitBuffer, channels]);

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      {/* Top bar */}
      <div style={{ padding: 20, background: '#111' }}>
        <h2>IPTV Player</h2>
        {currentIndex >= 0 && <p>Now playing: <strong>{channels[currentIndex]?.name}</strong></p>}
      </div>

      {/* Channel strip */}
      <div className="strip">
        {channels.map((ch, idx) => (
          <div key={ch.id} className={`card ${currentIndex === idx ? 'active' : ''}`} onClick={() => playChannel(idx)}>
            <button className={`star ${favorites.includes(ch.id) ? 'fav' : ''}`} onClick={(e) => toggleFavorite(ch.id, e)}>★</button>
            <div className="logo">{ch.name[0]}</div>
            <div className="name">{ch.name}</div>
            <div style={{ fontSize: 12, color: '#aaa' }}>{ch.group}</div>
          </div>
        ))}
      </div>

      {/* Number entry OSD */}
      {digitBuffer !== '' && (
        <div className="number-osd">
          {digitBuffer}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
